<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디자인상상 · 업무 플랫폼</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
:root{
  --bg:#F4F1E8;
  --surface:#FFFFFF;
  --surface-2:#FBF9F3;
  --ink:#221F19;
  --ink-dim:#6E6656;
  --ink-faint:#A79E8B;
  --line:#E2DBC8;
  --line-strong:#CFC5AA;
  --accent:#7B5A34;
  --accent-deep:#4E3A21;
  --accent-soft:#EFE4CE;
  --pine:#20301F;
  --pine-2:#2C4429;
  --danger:#9C3B2E;
  --danger-soft:#F3E2DE;
  --radius:10px;
  --shadow:0 1px 2px rgba(34,31,25,.06), 0 8px 24px -10px rgba(34,31,25,.18);
  /* stage colors */
  --s1:#8C8267; --s1-soft:#EFEBE0;
  --s2:#B08D57; --s2-soft:#F3E9D6;
  --s3:#5C7A6B; --s3-soft:#E3ECE7;
  --s4:#5E76A6; --s4-soft:#E4E9F3;
  --s5:#4E3A21; --s5-soft:#E9E1D3;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num,.mono{font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ===== Shell ===== */
#app{display:flex; min-height:100vh;}

.sidebar{
  width:224px; flex:none;
  background:var(--accent-deep);
  color:#F2EEDF;
  padding:22px 14px 20px;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{padding:2px 10px 22px;}
.brand-name{font-size:16px; font-weight:800; letter-spacing:-.01em;}
.brand-sub{font-size:10.5px; letter-spacing:.1em; opacity:.55; margin-top:3px; text-transform:uppercase;}

.snav{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.snav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 11px; border-radius:8px; border:none;
  background:transparent; color:rgba(242,238,223,.72);
  font-size:13.5px; font-weight:600; text-align:left; width:100%;
}
.snav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
.snav-item.active{background:var(--accent); color:#fff;}
.snav-item .idx{
  font-family:'JetBrains Mono',monospace; font-size:10.5px;
  width:22px; height:22px; flex:none; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.1);
}
.snav-item.active .idx{background:rgba(255,255,255,.25);}
.snav-footer{margin-top:auto; padding:12px 11px 0; font-size:10.5px; color:rgba(242,238,223,.4); border-top:1px solid rgba(255,255,255,.1); margin-top:16px; padding-top:14px;}

.main{flex:1; min-width:0; padding:26px 32px 60px;}
.tool-frame-wrap{margin:-26px -32px -60px; height:calc(100vh); background:var(--surface); display:flex; flex-direction:column;}
.tool-frame{width:100%; height:100%; border:none; display:block; flex:1;}
.tool-frame-topbar{flex:none; display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--line); font-size:13px; font-weight:700; color:var(--ink-dim);}

.settings-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px; margin-top:20px;}
.cust-del-cell{width:36px; text-align:center;}
.btn-remove{border:1.3px solid var(--danger); color:var(--danger); background:transparent; width:26px; height:26px; border-radius:6px; font-size:14px; line-height:1;}
.btn-remove:hover{background:var(--danger); color:#fff;}

.cust-search{width:100%; max-width:360px; padding:9px 12px; border:1.3px solid var(--line-strong); border-radius:8px; font-size:13px; margin:18px 0 14px;}
.est-hub-list{display:flex; flex-direction:column; gap:10px;}
.est-hub-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
.est-hub-card-head{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.est-hub-cust-name{font-size:14.5px; font-weight:800; color:var(--ink);}
.est-hub-cust-sub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
.est-hub-quotes{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); display:flex; flex-direction:column; gap:4px;}
.est-hub-quote-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 8px; border-radius:6px; cursor:pointer; font-size:12.5px;}
.ct-hub-list{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
.ct-hub-row{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 16px;}
.site-list{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
.site-card{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; cursor:pointer;}
.site-card:hover{border-color:var(--accent);}
.site-color-dot{width:14px; height:14px; border-radius:50%; flex:none;}
.site-card-main{flex:1;}
.site-card-name{font-size:14px; font-weight:800;}
.site-card-sub{font-size:11.5px; color:var(--ink-faint); margin-top:3px;}
.site-card-meta{font-size:11px; color:var(--ink-faint); flex:none;}
.site-tabs{display:flex; gap:6px; border-bottom:1.5px solid var(--line); margin-bottom:18px;}
.site-tab{padding:10px 16px; font-size:13px; font-weight:700; color:var(--ink-faint); border-bottom:2.5px solid transparent; margin-bottom:-1.5px;}
.site-tab.active{color:var(--accent-deep); border-bottom-color:var(--accent);}
.site-tab-panel{padding-top:4px;}
.settle-summary-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
.settle-summary-box{flex:1; min-width:140px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px;}
.settle-summary-box .k{font-size:10.5px; color:var(--ink-faint); font-weight:700;}
.settle-summary-box .v{font-size:15px; font-weight:800; margin-top:4px;}
.settle-fee-box{background:var(--surface-2); border:1.3px dashed var(--line-strong); border-radius:10px; padding:16px; margin-bottom:20px;}
.settle-fee-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.settle-fee-grid .field label{font-size:11px; color:var(--ink-faint); display:block; margin-bottom:4px;}
.settle-fee-grid .field input{width:100%; padding:8px 9px; border:1.3px solid var(--line-strong); border-radius:7px; font-size:12.5px;}
.settle-fee-total{margin-top:12px; font-size:13px; padding-top:12px; border-top:1px dashed var(--line-strong);}
.settle-table-wrap{overflow-x:auto;}
table.settle-table{width:100%; border-collapse:collapse; font-size:11.5px;}
table.settle-table th{text-align:left; font-size:10px; color:var(--ink-faint); border-bottom:1.5px solid var(--ink); padding:6px 5px; white-space:nowrap;}
table.settle-table td{padding:4px; border-bottom:1px solid var(--line);}
table.settle-table input, table.settle-table select{width:100%; min-width:64px; padding:5px 6px; border:1px solid var(--line-strong); border-radius:5px; font-size:11px;}
.ct-hub-name{font-size:13.5px; font-weight:700;}
.ct-hub-meta{font-size:11px; color:var(--ink-faint); margin-top:3px;}
.est-hub-quote-row:hover{background:var(--surface-2);}
.est-hub-quote-name{font-weight:700; color:var(--ink);}
.est-hub-quote-meta{color:var(--ink-faint);}
.settings-card{
  background:var(--surface); border:1.5px solid var(--line-strong); border-radius:12px;
  padding:20px 18px; text-align:left; cursor:pointer; transition:.15s;
}
.settings-card:hover{border-color:var(--accent); background:var(--accent-soft);}
.settings-card-ico{font-size:24px; margin-bottom:8px;}
.settings-card-title{font-size:14px; font-weight:800; margin-bottom:6px;}
.settings-card-desc{font-size:12px; color:var(--ink-dim); line-height:1.5;}

/* ===== Login ===== */
.login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg);}
.login-box{width:320px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:32px 28px 26px;}
.login-box .brand-name{font-size:19px; font-weight:800; margin-bottom:2px;}
.login-sub{font-size:12px; color:var(--ink-dim); margin-bottom:22px;}
.login-label{display:block; font-size:12px; font-weight:700; color:var(--ink-dim); margin:14px 0 6px;}
.login-input{width:100%; padding:10px 12px; border:1.3px solid var(--line-strong); border-radius:8px; font-size:13.5px; background:var(--surface-2); color:var(--ink);}
.login-input:focus{outline:none; border-color:var(--accent);}
.login-error{margin-top:12px; font-size:12px; color:var(--danger); background:var(--danger-soft); padding:8px 10px; border-radius:6px;}
.login-success{margin-top:12px; font-size:12px; color:#3B6B3F; background:#E3EFE3; padding:8px 10px; border-radius:6px;}
.link-btn{display:block; width:100%; margin-top:10px; background:none; border:none; color:var(--ink-dim); font-size:12px; text-decoration:underline; cursor:pointer; padding:4px;}
.login-submit{width:100%; margin-top:18px; padding:11px; font-size:13.5px;}
.login-note{margin-top:16px; font-size:10.5px; line-height:1.5; color:var(--ink-faint);}
.snav-user{font-size:11.5px; color:#F2EEDF; opacity:.85; margin-bottom:6px;}
.snav-logout{background:none; border:1px solid rgba(242,238,223,.3); color:#F2EEDF; font-size:11px; padding:5px 10px; border-radius:6px; width:100%;}
.snav-logout:hover{background:rgba(242,238,223,.1);}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.page-head h1{font-size:22px; font-weight:800; margin:0 0 4px; letter-spacing:-.01em;}
.page-head .desc{font-size:12.5px; color:var(--ink-dim);}
.page-actions{display:flex; gap:8px;}

.btn{border:none; border-radius:8px; padding:9px 15px; font-size:12.5px; font-weight:700;}
.btn-primary{background:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-deep);}
.btn-ghost{background:var(--surface-2); border:1.3px solid var(--line-strong); color:var(--ink);}
.btn-ghost:hover{background:var(--accent-soft); border-color:var(--accent);}
.btn-danger{background:var(--danger-soft); color:var(--danger); border:1.3px solid var(--danger);}
.btn-danger:hover{background:var(--danger); color:#fff;}
.btn-sm{padding:6px 11px; font-size:11.5px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}

/* ===== Dashboard ===== */
.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
.stat-card{padding:16px 18px;}
.stat-label{font-size:11px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
.stat-value{font-size:26px; font-weight:800; margin-top:6px; color:var(--accent-deep);}
.stat-sub{font-size:11px; color:var(--ink-dim); margin-top:2px;}

.dash-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:16px;}
.panel{padding:18px 20px;}
.panel-title{font-size:13.5px; font-weight:800; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
.panel-title .link{font-size:11.5px; font-weight:600; color:var(--accent);}
.empty-note{color:var(--ink-faint); font-size:12.5px; padding:16px 4px; text-align:center;}

.agenda-item{display:flex; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line); align-items:center;}
.site-dot{width:9px; height:9px; border-radius:50%; flex:none;}
.status-tag{font-size:11px; font-weight:800;}
.status-tentative{color:var(--ink-faint);}
.status-confirmed{color:var(--accent-deep);}
.btn-confirm-event{flex:none; padding:5px 10px; font-size:11px; font-weight:700; border:1.3px solid var(--accent); color:var(--accent); background:transparent; border-radius:6px;}
.btn-confirm-event:hover{background:var(--accent); color:#fff;}
.agenda-item:last-child{border-bottom:none;}
.agenda-time{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-dim); width:46px; flex:none; padding-top:1px;}
.agenda-type{
  flex:none; font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; height:fit-content;
}
.agenda-title{font-size:13px; font-weight:600; flex:1;}
.agenda-cust{font-size:11px; color:var(--ink-faint); margin-top:1px;}

.mini-cust{display:flex; align-items:center; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--line);}
.mini-cust:last-child{border-bottom:none;}
.mini-cust-name{font-size:13px; font-weight:700;}
.mini-cust-sub{font-size:11px; color:var(--ink-faint); margin-top:1px;}

/* ===== Status / type tags ===== */
.tag{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:5px;}
.tag-1{background:var(--s1-soft); color:var(--s1);}
.tag-2{background:var(--s2-soft); color:var(--s2);}
.tag-3{background:var(--s3-soft); color:var(--s3);}
.tag-4{background:var(--s4-soft); color:var(--s4);}
.tag-5{background:var(--s5-soft); color:var(--s5);}
.tag-signed{background:#3E6B5C; color:#fff;}
.tag-pending{background:var(--surface-2); color:var(--ink-faint); border:1px solid var(--line-strong);}

/* ===== Calendar ===== */
.cal-head{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.cal-nav{display:flex; gap:4px;}
.cal-nav button{width:30px; height:30px; border-radius:7px; border:1.3px solid var(--line-strong); background:var(--surface); font-size:13px;}
.cal-nav button:hover{background:var(--accent-soft);}
.cal-month-label{font-size:16px; font-weight:800; min-width:110px;}
.cal-legend{display:flex; gap:10px; margin-left:auto; flex-wrap:wrap;}
.cal-legend span{font-size:11px; color:var(--ink-dim); display:flex; align-items:center; gap:5px;}
.cal-legend .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--line);}
.cal-dow{background:var(--surface-2); text-align:center; font-size:11px; font-weight:700; color:var(--ink-faint); padding:8px 0;}
.cal-cell{
  background:var(--surface); min-height:96px; padding:6px 6px 8px;
  display:flex; flex-direction:column; gap:3px; cursor:pointer;
}
.cal-cell:hover{background:var(--surface-2);}
.cal-cell.other-month{background:#F7F5EF; color:var(--ink-faint);}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--accent);}
.cal-cell.drag-over{background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent);}
.cal-date{font-size:11.5px; font-weight:700; font-family:'JetBrains Mono',monospace;}
.cal-cell.other-month .cal-date{color:var(--ink-faint);}
.cal-evt{
  font-size:10.5px; padding:2px 5px; border-radius:4px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:grab;
}
.cal-evt:active{cursor:grabbing;}
.dur-badge{font-size:9px; opacity:.7; font-weight:800;}
.cal-more{font-size:10px; color:var(--ink-faint); padding-left:5px;}

/* ===== Customers table ===== */
.filter-row{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.filter-row input[type=text]{
  padding:8px 12px; border:1.3px solid var(--line-strong); border-radius:8px; font-size:12.5px; width:220px;
}
.filter-row select{padding:8px 10px; border:1.3px solid var(--line-strong); border-radius:8px; font-size:12.5px; background:#fff;}

table.list{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
table.list thead th{
  background:var(--surface-2); text-align:left; font-size:11px; font-weight:700; color:var(--ink-faint);
  text-transform:uppercase; letter-spacing:.04em; padding:10px 12px; border-bottom:1px solid var(--line);
}
table.list td{padding:11px 12px; border-bottom:1px solid var(--line); font-size:13px;}
table.list tbody tr:last-child td{border-bottom:none;}
table.list tbody tr{cursor:pointer;}
table.list tbody tr:hover{background:var(--surface-2);}
.cust-name{font-weight:700;}
.cust-phone{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim);}

/* ===== Kanban ===== */
.kanban{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; align-items:start;}
.kcol{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:10px; min-height:140px;}
.kcol.drag-over{outline:2px dashed var(--accent); outline-offset:-2px;}
.kcol-head{display:flex; align-items:center; justify-content:space-between; padding:4px 4px 10px;}
.kcol-title{font-size:12px; font-weight:800;}
.kcol-count{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-faint);}
.kcard{
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:11px 12px; margin-bottom:8px; cursor:grab; box-shadow:var(--shadow);
}
.kcard:active{cursor:grabbing;}
.kcard.dragging{opacity:.4;}
.kcard-cust{font-size:13px; font-weight:700;}
.kcard-name{font-size:11.5px; color:var(--ink-dim); margin-top:2px;}
.kcard-amt{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--accent-deep); margin-top:6px; font-weight:700;}
.kcol-empty{font-size:11px; color:var(--ink-faint); text-align:center; padding:14px 4px;}

/* ===== Placeholder (견적 관리) ===== */
.placeholder-box{
  background:var(--surface-2); border:1.5px dashed var(--line-strong); border-radius:var(--radius);
  padding:34px 24px; text-align:center; margin-bottom:20px;
}
.placeholder-box .ico{font-size:26px; margin-bottom:8px;}
.placeholder-box h3{font-size:15px; margin:0 0 6px;}
.placeholder-box p{font-size:12.5px; color:var(--ink-dim); max-width:440px; margin:0 auto;}

/* ===== Modal ===== */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(34,31,25,.45);
  display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
}
.modal{
  background:var(--surface); border-radius:14px; width:100%; max-width:440px;
  max-height:90vh; overflow-y:auto; padding:22px 24px 24px; box-shadow:0 20px 60px -10px rgba(0,0,0,.35);
}
.modal h2{font-size:16px; margin:0 0 16px; font-weight:800;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px;}
.field label .req{color:var(--danger); font-weight:800; text-transform:none; letter-spacing:0; margin-left:3px;}
.loading-note{padding:60px 0; text-align:center; color:var(--ink-faint); font-size:13.5px;}
.field input, .field select, .field textarea{
  width:100%; padding:9px 11px; border:1.3px solid var(--line-strong); border-radius:8px; font-size:13px; background:#fff;
}
.field textarea{resize:vertical; min-height:56px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.phone-input-row{display:flex; align-items:center; gap:6px;}
.addr-search-row{display:flex; gap:6px;}
.addr-search-row input{flex:1;}
.addr-result-row{display:flex; align-items:center; gap:8px; margin-top:6px;}
.addr-result-row.hidden{display:none;}
.addr-radio{display:flex; align-items:center; gap:4px; font-size:12px; font-weight:700; color:var(--ink-dim); flex:none; white-space:nowrap;}
.addr-result-row input[type="text"]{flex:1; background:var(--surface-2);}
.addr-final-preview{margin-top:6px; font-size:12px; font-weight:700; color:var(--accent-deep); min-height:16px;}
.phone-prefix{font-size:13.5px; font-weight:700; color:var(--ink); background:var(--surface-2); border:1.3px solid var(--line-strong); border-radius:8px; padding:9px 10px;}
.phone-dash{color:var(--ink-faint); font-weight:700;}

async function checkApprovalAndBoot(user){
  const { data: profile, error } = await sb.from('profiles').select('approved, name, role').eq('id', user.id).single();
  if(error || !profile){
    showPendingScreen('계정 정보를 확인할 수 없어요. 잠시 후 다시 시도하거나 관리자에게 문의해주세요.');
    await sb.auth.signOut();
    return;
  }
  if(!profile.approved){
    showPendingScreen('아직 관리자 승인 대기중이에요. 승인되면 다시 로그인해주세요.');
    await sb.auth.signOut();
    return;
  }
  bootApp({ name: profile.name || user.email, email: user.email, role: profile.role });
}

function uid(prefix){
  // Supabase uuid 컬럼과 호환되는 표준 UUID를 생성합니다 (prefix는 이제 쓰지 않지만 호출부 호환을 위해 유지)
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

/* 주소에서 "동이름+단지명 리모델링" 형태의 프로젝트명을 추정합니다. 항상 사용자가 수정 가능합니다. */
function generateProjectName(address){
  if(!address) return '';
  const tokens = address.trim().split(/\s+/);
  let dong = '', dongIdx = -1;
  for(let i=0;i<tokens.length;i++){
    if(/^[가-힣]+동$/.test(tokens[i])){ dong = tokens[i]; dongIdx = i; break; }
  }
  let complexName = '';
  if(dongIdx>=0){
    for(let i=dongIdx+1;i<tokens.length;i++){
      const t = tokens[i];
      if(/^\d+(-\d+)?$/.test(t)) continue;
      if(/^\d+동$/.test(t) || /^\d+호$/.test(t) || /^\d+동\d*호?$/.test(t)) break;
      complexName += t;
    }
  }
  const base = dong ? (dong + complexName) : (complexName || tokens[tokens.length-1] || '');
  return base ? base + ' 리모델링' : '';
}

async function syncTable(table, localArr, toDb){
  try{
    const rows = localArr.map(toDb);
    if(rows.length){
      const { error } = await sb.from(table).upsert(rows);
      if(error){ console.error(table+' 저장 오류', error); return; }
    }
    const { data: serverRows, error: selErr } = await sb.from(table).select('id');
    if(!selErr && serverRows){
      const localIds = new Set(localArr.map(r=>r.id));
      const toDelete = serverRows.filter(r=>!localIds.has(r.id)).map(r=>r.id);
      if(toDelete.length){ await sb.from(table).delete().in('id', toDelete); }
    }
  }catch(e){ console.error(table+' 동기화 실패', e); }
}

    ]);
    if(r1.error || r2.error || r3.error){
      console.error('불러오기 실패', r1.error, r2.error, r3.error);
      return false;
    }
    state.customers = (r1.data||[]).map(customerFromDb);
    state.events = (r2.data||[]).map(eventFromDb);
    state.projects = (r3.data||[]).map(projectFromDb);
    state.sites = r4.error ? [] : (r4.data||[]).map(siteFromDb);
    return true;
  }catch(e){ console.error(e); return false; }
}

/* ============ Helpers ============ */
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function won(n){ n = Math.round(n||0); return n.toLocaleString('ko-KR'); }
function fmtNum(n){ n = Math.round(Number(n)||0); return n===0 ? '' : n.toLocaleString('ko-KR'); }
function parseCommaNum(str){ if(!str) return 0; const n = Number(String(str).replace(/,/g,'')); return isNaN(n) ? 0 : n; }
document.addEventListener('input', e=>{
  if(e.target.classList && e.target.classList.contains('money-input')){
    const raw = e.target.value.replace(/[^\d-]/g,'');
    const num = raw === '' || raw === '-' ? raw : Number(raw);
    e.target.value = (num==='' || num==='-') ? num : num.toLocaleString('ko-KR');
  }
});
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')';
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function customerById(id){ return state.customers.find(c=>c.id===id); }
function statusLabel(id){ const s = CUSTOMER_STATUSES.find(x=>x.id===id); return s?s.label:'-'; }
function eventTypeInfo(id){ return EVENT_TYPES.find(t=>t.id===id) || EVENT_TYPES[EVENT_TYPES.length-1]; }
function eventsOn(dateISO){ return state.events.filter(e=>e.date===dateISO).sort((a,b)=>(a.start||'').localeCompare(b.start||'')); }
function upcomingEvents(limit){
  const t = todayISO();
  return state.events.filter(e=>e.date>=t).sort((a,b)=> (a.date+a.start) < (b.date+b.start) ? -1 : 1).slice(0, limit);
}

/* ============ Schedule (calendar) ============ */
function renderSchedule(){
  if(state.calYear===null){ const d=new Date(); state.calYear=d.getFullYear(); state.calMonth=d.getMonth(); }
  let html = '<div class="page-head"><div><h1>일정 관리</h1><div class="desc">상담·실측·시공 일정을 한눈에 관리하세요.</div></div>'+
    '<div class="page-actions"><button class="btn btn-primary" data-act="new-event">+ 새 일정</button></div></div>';

  html += '<div class="card" style="padding:18px 20px;">';
  html += '<div class="cal-head">'+
    '<div class="cal-nav"><button data-cal="prev">‹</button><button data-cal="today">오늘</button><button data-cal="next">›</button></div>'+
    '<div class="cal-month-label">'+state.calYear+'년 '+(state.calMonth+1)+'월</div>'+
    '<div class="cal-legend">'+EVENT_TYPES.map(t=>'<span><span class="dot" style="background:var(--s'+t.tag+')"></span>'+t.label+'</span>').join('')+'</div>'+
  '</div>';

  html += '<div class="cal-grid">';
  DOW.forEach(d=>{ html += '<div class="cal-dow">'+d+'</div>'; });

  const first = new Date(state.calYear, state.calMonth, 1);
  const startOffset = first.getDay();
  const gridStart = new Date(state.calYear, state.calMonth, 1 - startOffset);
  const t = todayISO();
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const iso = d.toISOString().slice(0,10);
    const inMonth = d.getMonth()===state.calMonth;
    const evts = eventsOn(iso);
    html += '<div class="cal-cell'+(inMonth?'':' other-month')+(iso===t?' today':'')+'" data-day="'+iso+'">';
    html += '<div class="cal-date">'+d.getDate()+'</div>';
    evts.slice(0,3).forEach(e=>{
      const ti = eventTypeInfo(e.type);
      const site = e.siteId ? siteById(e.siteId) : null;
      const borderStyle = site ? ' style="border-left:3px solid '+site.color+';"' : '';
      const durBadge = (e.durationDays && e.durationDays>1) ? ' <span class="dur-badge">'+e.durationDays+'일</span>' : '';
      html += '<div class="cal-evt tag-'+ti.tag+'"'+borderStyle+' draggable="true" data-open-event="'+e.id+'" data-drag-event="'+e.id+'">'+(e.start?e.start+' ':'')+statusPrefix(e.status)+escapeHtml(e.title)+durBadge+'</div>';
    });
    if(evts.length>3) html += '<div class="cal-more">+'+(evts.length-3)+'건 더보기</div>';
    html += '</div>';
  }
  html += '</div></div>';

  $main.innerHTML = html;
  bindGlobalActions();
  $main.querySelectorAll('[data-cal]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const act = el.dataset.cal;
      if(act==='today'){ const d=new Date(); state.calYear=d.getFullYear(); state.calMonth=d.getMonth(); }
      else{
        state.calMonth += (act==='next'?1:-1);
        if(state.calMonth<0){ state.calMonth=11; state.calYear--; }
        if(state.calMonth>11){ state.calMonth=0; state.calYear++; }
      }
      renderSchedule();
    });
  });
  $main.querySelectorAll('[data-day]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      if(ev.target.closest('[data-open-event]')) return;
      openEventModal(null, el.dataset.day);
    });
    el.addEventListener('dragover', (ev)=>{ ev.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()=>{ el.classList.remove('drag-over'); });
    el.addEventListener('drop', async (ev)=>{
      ev.preventDefault();
      el.classList.remove('drag-over');
      const evId = ev.dataTransfer.getData('text/plain');
      const e = state.events.find(x=>x.id===evId);
      if(!e || e.date===el.dataset.day) return;
      e.date = el.dataset.day;
      await sb.from('events').update({date:e.date}).eq('id', e.id);
      renderMain();
    });
  });
  $main.querySelectorAll('[data-drag-event]').forEach(el=>{
    el.addEventListener('dragstart', (ev)=>{
      ev.dataTransfer.setData('text/plain', el.dataset.dragEvent);
      ev.dataTransfer.effectAllowed = 'move';
    });
  });
  $main.querySelectorAll('[data-open-event]').forEach(el=>{
    el.addEventListener('click', (ev)=>{ ev.stopPropagation(); openEventModal(el.dataset.openEvent); });
  });
  bindConfirmEventButtons();
}
function bindConfirmEventButtons(){
  $main.querySelectorAll('[data-confirm-event]').forEach(el=>{
    el.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const id = el.dataset.confirmEvent;
      const e = state.events.find(x=>x.id===id);
      if(!e) return;
      e.status = 'confirmed';
      await sb.from('events').update({status:'confirmed'}).eq('id', id);
      renderMain();
    });
  });
}

  $main.querySelectorAll('[data-del-customer]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const c = customerById(el.dataset.delCustomer);
      if(!c) return;
      if(confirm('"'+c.name+'" 고객 정보를 삭제할까요? 연결된 일정/프로젝트/견적은 유지되지만 고객 연결이 해제돼요.')){
        state.customers = state.customers.filter(x=>x.id!==c.id);
        state.events.forEach(ev=>{ if(ev.customerId===c.id) ev.customerId=null; });
        state.projects.forEach(p=>{ if(p.customerId===c.id) p.customerId=null; });
        save(); renderCustomers();
      }
    });
  });
}

/* ---- 정산 탭 ---- */
async function settlementTabHTML(s, contract){
  const { data: expenses } = await sb.from('site_expenses').select('*').eq('site_id', s.id).order('sort_order', {ascending:true});
  const list = expenses || [];
  state.siteExpensesCache = list;
  const isDirect = contract && contract.quote_type==='direct';

  let actualSum = 0, vatSum = 0, companySum = 0, customerSum = 0;
  list.forEach(e=>{
    actualSum += Number(e.actual_amount)||0;
    vatSum += Number(e.vat_amount)||0;
    const lineTotal = (Number(e.actual_amount)||0) + (Number(e.vat_amount)||0);
    if(e.paid_by==='customer') customerSum += lineTotal; else companySum += lineTotal;
  });

  let html = '<div class="site-tab-panel">';
  html += '<div class="settle-summary-row">'+
    '<div class="settle-summary-box"><div class="k">실행가 합계</div><div class="v">₩ '+won(actualSum)+'</div></div>'+
    '<div class="settle-summary-box"><div class="k">부가세 합계</div><div class="v">₩ '+won(vatSum)+'</div></div>'+
    '<div class="settle-summary-box"><div class="k">회사 지출</div><div class="v">₩ '+won(companySum)+'</div></div>'+
    '<div class="settle-summary-box"><div class="k">고객 직접 지출</div><div class="v">₩ '+won(customerSum)+'</div></div>'+
    (contract ? '<div class="settle-summary-box"><div class="k">계약금액 대비 잔여</div><div class="v">₩ '+won((contract.total||0)-(actualSum+vatSum))+'</div></div>' : '')+
  '</div>';

  if(isDirect){
    const feePercent = s.feePercent!==null && s.feePercent!==undefined ? s.feePercent : '';
    html += '<div class="settle-fee-box">'+
      '<div class="detail-section-title" style="margin-top:0;">직영 수수료 정산</div>'+
      '<div class="settle-fee-grid">'+
        '<div class="field"><label>공과잡비</label><input type="text" inputmode="numeric" class="money-input" id="settle-misc" value="'+fmtNum(s.miscFee||0)+'"></div>'+
        '<div class="field"><label>수수료율 (%, 비우면 기본값 사용)</label><input type="number" step="0.1" id="settle-fee-pct" value="'+feePercent+'" placeholder="기본값"></div>'+
        '<div class="field"><label>기타 조정 (+/-)</label><input type="text" inputmode="numeric" class="money-input" id="settle-adj" value="'+fmtNum(s.adjustment||0)+'"></div>'+
        '<div class="field"><label>조정 사유</label><input type="text" id="settle-adj-note" value="'+escapeHtml(s.adjustmentNote||'')+'" placeholder="예: 목공자재비 별도 반영"></div>'+
      '</div>'+
      '<div class="settle-fee-total" id="settle-fee-total"></div>'+
      '<button class="btn btn-primary btn-sm" id="settle-fee-save" style="margin-top:10px;">저장</button>'+
    '</div>';
  }

  html += '<div class="detail-section-title">지출 내역 ('+list.length+')</div>';
  html += '<div class="settle-table-wrap"><table class="settle-table"><thead><tr>'+
    '<th>공정</th><th>항목</th><th>거래처</th><th>견적가</th><th>실행가</th><th>부가세</th><th>입금자</th><th>지출주체</th><th>완료</th><th></th>'+
  '</tr></thead><tbody id="settle-tbody">'+
    list.map(e=>settleRowHTML(e)).join('')+
  '</tbody></table></div>';
  html += '<button class="btn btn-secondary btn-sm" id="settle-add-row" style="margin-top:10px;">+ 지출 항목 추가</button>';
  html += '</div>';
  return html;
}
function settleRowHTML(e){
  return '<tr data-eid="'+e.id+'">'+
    '<td><input type="text" class="settle-in" data-field="category" value="'+escapeHtml(e.category||'')+'" placeholder="공정"></td>'+
    '<td><input type="text" class="settle-in" data-field="item" value="'+escapeHtml(e.item||'')+'" placeholder="항목"></td>'+
    '<td><input type="text" class="settle-in" data-field="vendor" value="'+escapeHtml(e.vendor||'')+'" placeholder="거래처"></td>'+
    '<td><input type="text" inputmode="numeric" class="settle-in money-input" data-field="quote_amount" value="'+fmtNum(e.quote_amount||0)+'"></td>'+
    '<td><input type="text" inputmode="numeric" class="settle-in money-input" data-field="actual_amount" value="'+fmtNum(e.actual_amount||0)+'"></td>'+
    '<td><input type="text" inputmode="numeric" class="settle-in money-input" data-field="vat_amount" value="'+fmtNum(e.vat_amount||0)+'"></td>'+
    '<td><input type="text" class="settle-in" data-field="payer" value="'+escapeHtml(e.payer||'')+'" placeholder="입금자"></td>'+
    '<td><select class="settle-in" data-field="paid_by"><option value="company" '+(e.paid_by!=='customer'?'selected':'')+'>회사</option><option value="customer" '+(e.paid_by==='customer'?'selected':'')+'>고객</option></select></td>'+
    '<td style="text-align:center;"><input type="checkbox" data-field="completed" '+(e.completed?'checked':'')+'></td>'+
    '<td><button class="btn-remove" data-role="settle-del" data-eid="'+e.id+'" title="삭제">×</button></td>'+
  '</tr>';
}
function bindSettlementEvents(s, contract){
  function computeFeeTotal(){
    const misc = parseCommaNum(document.getElementById('settle-misc').value);
    const pctRaw = document.getElementById('settle-fee-pct').value;
    const adj = parseCommaNum(document.getElementById('settle-adj').value);
    const actualSum = (state.siteExpensesCache||[]).reduce((sum,e)=>sum+(Number(e.actual_amount)||0),0);
    const pct = pctRaw !== '' ? Number(pctRaw) : null;
    const fee = pct!==null ? actualSum*pct/100 : 0;
    const total = misc + fee + adj;
    const el = document.getElementById('settle-fee-total');
    if(el) el.innerHTML = '수수료'+(pct!==null?' ('+pct+'%, ₩'+won(fee)+')':' (수수료율 미입력)')+' + 공과잡비 ₩'+won(misc)+' + 조정 ₩'+won(adj)+' = <b>₩ '+won(total)+'</b>';
  }
  const miscEl = document.getElementById('settle-misc');
  if(miscEl){
    computeFeeTotal();
    ['settle-misc','settle-fee-pct','settle-adj'].forEach(id=>{
      document.getElementById(id).addEventListener('input', computeFeeTotal);
    });
    document.getElementById('settle-fee-save').addEventListener('click', async ()=>{
      const btn = document.getElementById('settle-fee-save');
      btn.disabled = true; btn.textContent = '저장 중…';
      const pctRaw = document.getElementById('settle-fee-pct').value;
      await sb.from('sites').update({
        misc_fee: parseCommaNum(document.getElementById('settle-misc').value),
        fee_percent: pctRaw!=='' ? Number(pctRaw) : null,
        adjustment: parseCommaNum(document.getElementById('settle-adj').value),
        adjustment_note: document.getElementById('settle-adj-note').value.trim(),
      }).eq('id', s.id);
      btn.disabled = false; btn.textContent = '저장';
      await load(); renderMain();
    });
  }
  document.getElementById('settle-add-row').addEventListener('click', async ()=>{
    const { data } = await sb.from('site_expenses').insert({ site_id: s.id }).select().single();
    if(data) renderMain();
  });
  $main.querySelectorAll('#settle-tbody tr').forEach(tr=>{
    const eid = tr.dataset.eid;
    tr.querySelectorAll('.settle-in').forEach(input=>{
      const evName = input.tagName==='SELECT' ? 'change' : (input.type==='checkbox' ? 'change' : 'input');
      input.addEventListener(evName, async e=>{
        const field = e.target.dataset.field;
        let value = e.target.type==='checkbox' ? e.target.checked
          : (['quote_amount','actual_amount','vat_amount'].includes(field) ? parseCommaNum(e.target.value) : e.target.value);
        await sb.from('site_expenses').update({[field]: value}).eq('id', eid);
        if(['actual_amount','vat_amount','paid_by'].includes(field)) renderMain();
      });
    });
  });
  $main.querySelectorAll('[data-role="settle-del"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('이 지출 항목을 삭제할까요?')) return;
      await sb.from('site_expenses').delete().eq('id', el.dataset.eid);
      renderMain();
    });
  });
}

  if(orphanQuotes.length){
    html += '<div class="detail-section-title" style="margin-top:24px;">고객 미연결 견적 ('+orphanQuotes.length+')</div>';
    html += '<div class="est-hub-list">'+orphanQuotes.map(q=>estHubQuoteRowHTML(q)).join('')+'</div>';
  }
  $main.innerHTML = html;
  bindEstHubBack();

  function renderList(filterQ){

/* ============ Projects (kanban) ============ */
function renderProjects(){
  let html = '<div class="page-head"><div><h1>프로젝트 현황</h1><div class="desc">카드를 드래그해서 단계를 이동하세요.</div></div>'+
    '<div class="page-actions"><button class="btn btn-primary" data-act="new-project">+ 새 프로젝트</button></div></div>';

  html += '<div class="kanban">';
  STAGES.forEach(stage=>{
    const items = state.projects.filter(p=>p.stage===stage.id);
    html += '<div class="kcol" data-stage-col="'+stage.id+'">'+
      '<div class="kcol-head"><span class="kcol-title">'+stage.label+'</span><span class="kcol-count num">'+items.length+'</span></div>';
    if(items.length===0){
      html += '<div class="kcol-empty">비어 있음</div>';
    } else {
      items.forEach(p=>{
        const cust = customerById(p.customerId);
        html += '<div class="kcard" draggable="true" data-project="'+p.id+'">'+
          '<div class="kcard-name">'+escapeHtml(p.name)+'</div>'+
          '<div class="kcard-cust">'+escapeHtml(cust?cust.name:'(고객 미지정)')+(cust&&cust.phone?' · '+escapeHtml(cust.phone):'')+'</div>'+
        '</div>';
      });
    }
    html += '</div>';
  });
  html += '</div>';

  $main.innerHTML = html;
  bindGlobalActions();
  bindKanbanDnD();
  $main.querySelectorAll('[data-project]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      if(state.drag) return;
      openProjectModal(el.dataset.project);
    });
  });
}
function bindKanbanDnD(){
  $main.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      state.drag = card.dataset.project;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', ()=>{
      card.classList.remove('dragging');
      state.drag = null;
      $main.querySelectorAll('.kcol').forEach(c=>c.classList.remove('drag-over'));
    });
  });
  $main.querySelectorAll('.kcol').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', ()=>{ col.classList.remove('drag-over'); });
    col.addEventListener('drop', e=>{
      e.preventDefault();
      col.classList.remove('drag-over');
      const pid = state.drag;
      if(!pid) return;
      const proj = state.projects.find(p=>p.id===pid);
      if(proj){ proj.stage = parseInt(col.dataset.stageCol,10); save(); renderProjects(); }
    });
  });
}

        '<div class="field-row">'+
          '<div class="field"><label>시작 시간</label><input type="time" id="f-start" value="'+(ev?ev.start||'':'')+'"></div>'+
          '<div class="field"><label>종료 시간</label><input type="time" id="f-end" value="'+(ev?ev.end||'':'')+'"></div>'+
        '</div>'+

        '<div class="field"><label>메모</label><textarea id="f-memo">'+escapeHtml(ev?ev.memo||'':'')+'</textarea></div>'+
        (ev&&ev.siteId ? '<div class="field"><label class="addr-radio" style="font-size:12.5px;"><input type="checkbox" id="f-confirmed" '+(ev.status==='confirmed'?'checked':'')+'> 이 일정 확정됨 (문자·통화로 확인 완료)</label></div>' : '')+
        '<div class="modal-actions">'+
          (ev? '<button class="btn btn-danger" id="btn-delete">삭제</button>':'')+
          '<button class="btn btn-primary" id="btn-save">'+(ev?'저장':'추가')+'</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  $modalRoot.innerHTML = html;
  bindModalClose();
  document.getElementById('btn-save').addEventListener('click', ()=>{
    const title = document.getElementById('f-title').value.trim();
    if(!title){ alert('제목을 입력해 주세요.'); return; }
    const data = {
      title,
      type: document.getElementById('f-type').value,
      customerId: document.getElementById('f-customer').value || null,
      date: document.getElementById('f-date').value || todayISO(),
      start: document.getElementById('f-start').value,
      end: document.getElementById('f-end').value,

    });
  }

  if(digits.length>=8){

  }
  return { p2:'', p3:'' };
}

    const address = addressBase ? (addressBase+(addressDetail?' '+addressDetail:'')) : '';
    if(!name){ alert('이름을 입력해 주세요.'); return; }
    if(p2.length!==4 || p3.length!==4){ alert('연락처 뒷자리 8자리를 모두 입력해 주세요. (예: 1234 / 5678)'); return; }
    if(!address){ alert('현장주소를 검색해서 입력해 주세요.'); return; }
    const phone = '010-'+p2+'-'+p3;
    const data = {
      name, phone, address,
      roadAddress, jibunAddress, zonecode, addressDetail, addressType,
      status: parseInt(document.getElementById('f-status').value,10),
      email: document.getElementById('f-email').value.trim(),
      source: document.getElementById('f-source').value.trim(),
      sitePassword: document.getElementById('f-site-pw').value.trim(),
      entrancePassword: document.getElementById('f-entrance-pw').value.trim(),
      onenoteLink: document.getElementById('f-onenote').value.trim(),
      memo: document.getElementById('f-memo').value.trim(),
    };
    if(c){
      Object.assign(c, data);
    } else {
      const newCustomer = Object.assign({id:uid('c'), createdAt:new Date().toISOString()}, data);
      state.customers.push(newCustomer);
      // 주소 기반으로 프로젝트명을 자동 생성해서 총괄 리스트에 함께 등록 (이름은 언제든 수정 가능)
      const autoName = generateProjectName(newCustomer.address) || (newCustomer.name + ' 리모델링');
      state.projects.push({ id:uid('p'), customerId:newCustomer.id, name:autoName, stage:1, amount:0, memo:'' });
    }
    save(); closeModal();
    if(state.view==='customers') renderCustomers(); else renderMain();
  });
  const delBtn = document.getElementById('btn-delete');
  if(delBtn){
    delBtn.addEventListener('click', ()=>{
      if(confirm('이 고객 정보를 삭제할까요? 연결된 일정/프로젝트는 유지되지만 고객 연결이 해제됩니다.')){
        state.customers = state.customers.filter(x=>x.id!==c.id);
        state.events.forEach(e=>{ if(e.customerId===c.id) e.customerId=null; });
        state.projects.forEach(p=>{ if(p.customerId===c.id) p.customerId=null; });
        save(); closeModal(); closeDetail(); renderMain();
      }
    });
  }
}

/* ============ Project modal ============ */
function openProjectModal(id){
  const p = id ? state.projects.find(x=>x.id===id) : null;
  const custOptions = state.customers.map(c=>'<option value="'+c.id+'" '+(p&&p.customerId===c.id?'selected':'')+'>'+escapeHtml(c.name)+'</option>').join('');
  const stageOptions = STAGES.map(s=>'<option value="'+s.id+'" '+(p&&p.stage===s.id?'selected':(!p&&s.id===1?'selected':''))+'>'+s.label+'</option>').join('');
  const html = ''+
    '<div class="modal-backdrop" id="modal-backdrop">'+
      '<div class="modal">'+
        '<button class="modal-close" id="modal-close">×</button>'+
        '<h2>'+(p?'프로젝트 수정':'새 프로젝트')+'</h2>'+
        (state.customers.length===0 ? '<div class="empty-note">먼저 고객을 등록해 주세요.</div>' : ''+
        '<div class="field"><label>고객</label><select id="f-customer">'+custOptions+'</select></div>'+
        '<div class="field"><label>프로젝트명</label><input type="text" id="f-name" value="'+escapeHtml(p?p.name:'')+'" placeholder="예: 34평 전체 리모델링"></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>단계</label><select id="f-stage">'+stageOptions+'</select></div>'+
          '<div class="field"><label>견적/계약 금액</label><input type="number" id="f-amount" value="'+(p?p.amount||'':'')+'" placeholder="0"></div>'+
        '</div>'+
        '<div class="field"><label>메모</label><textarea id="f-memo">'+escapeHtml(p?p.memo||'':'')+'</textarea></div>'+
        '<div class="modal-actions">'+
          (p? '<button class="btn btn-danger" id="btn-delete">삭제</button>':'')+
          '<button class="btn btn-primary" id="btn-save">'+(p?'저장':'추가')+'</button>'+
        '</div>')+
      '</div>'+
    '</div>';
  $modalRoot.innerHTML = html;
  bindModalClose();
  const saveBtn = document.getElementById('btn-save');
  if(saveBtn){
    saveBtn.addEventListener('click', ()=>{
      const name = document.getElementById('f-name').value.trim();
      if(!name){ alert('프로젝트명을 입력해 주세요.'); return; }
      const data = {
        customerId: document.getElementById('f-customer').value,
        name,
        stage: parseInt(document.getElementById('f-stage').value,10),
        amount: Number(document.getElementById('f-amount').value)||0,
        memo: document.getElementById('f-memo').value.trim(),
      };
      if(p){ Object.assign(p, data); } else { state.projects.push(Object.assign({id:uid('p')}, data)); }
      save(); closeModal(); renderMain();
    });
  }
  const delBtn = document.getElementById('btn-delete');
  if(delBtn){
    delBtn.addEventListener('click', ()=>{
      if(confirm('이 프로젝트를 삭제할까요?')){
        state.projects = state.projects.filter(x=>x.id!==p.id);
        save(); closeModal(); renderMain();
      }
    });
  }
}

/* ============ Modal helpers ============ */
function bindModalClose(){
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', e=>{ if(e.target.id==='modal-backdrop') closeModal(); });
}
function closeModal(){ $modalRoot.innerHTML = ''; }

/* ============ Customer detail panel ============ */
function goToEstimateForCustomer(c, quoteId){
  let qs = '?customer_id='+encodeURIComponent(c.id)+'&customer_name='+encodeURIComponent(c.name);
  const proj = state.projects.find(p=>p.customerId===c.id);
  if(proj) qs += '&project_name='+encodeURIComponent(proj.name);
  if(quoteId) qs += '&quote_id='+encodeURIComponent(quoteId);
  state.estimateQuery = qs;
  state.estimateSection = 'quotes';
  state.view = 'estimate';
  closeDetail();
  renderMain(); renderNav();
}
async function loadCustomerQuotesIntoDetail(c){
  const box = document.getElementById('detail-quotes-list');
  if(!box) return;
  const { data, error } = await sb.from('quotes').select('id, label, total, created_at').eq('customer_id', c.id).order('created_at', {ascending:false});
  const nowBox = document.getElementById('detail-quotes-list');
  if(!nowBox) return; // 패널이 이미 닫힌 경우
  if(error){ nowBox.innerHTML = '<div class="empty-note">견적을 불러오지 못했어요.</div>'; return; }
  const list = data || [];
  if(list.length===0){ nowBox.innerHTML = '<div class="empty-note">아직 작성된 견적이 없어요.</div>'; return; }
  nowBox.innerHTML = list.map(q=>{
    let d = ''; try{ d = q.created_at.slice(0,10); }catch(e){}
    return '<div class="mini-cust" data-quote="'+q.id+'" style="cursor:pointer;">'+
      '<div class="mini-cust-name">'+escapeHtml(q.label)+'</div>'+
      '<span class="tag" style="background:var(--surface-2);">₩ '+won(q.total||0)+'</span>'+
    '</div>';
  }).join('');
  nowBox.querySelectorAll('[data-quote]').forEach(el=>{
    el.addEventListener('click', ()=> goToEstimateForCustomer(c, el.dataset.quote));
  });
}
function openCustomerDetail(id){
  const c = customerById(id);
  if(!c) return;
  const custEvents = state.events.filter(e=>e.customerId===c.id).sort((a,b)=> a.date<b.date?1:-1).slice(0,6);
  const custProjects = state.projects.filter(p=>p.customerId===c.id);
  let html = '<div class="detail-panel-backdrop" id="detail-backdrop"></div>'+
    '<div class="detail-panel">'+
      '<button class="detail-close" id="detail-close">×</button>'+
      '<span class="tag tag-'+c.status+'">'+statusLabel(c.status)+'</span>'+
      '<div class="detail-name">'+escapeHtml(c.name)+'</div>'+
      '<div class="detail-row"><span class="k">연락처</span><span class="v">'+escapeHtml(c.phone||'-')+'</span></div>'+
      '<div class="detail-row"><span class="k">현장주소</span><span class="v">'+escapeHtml(c.address||'-')+'</span></div>'+
      (c.email? '<div class="detail-row"><span class="k">이메일</span><span class="v">'+escapeHtml(c.email)+'</span></div>' : '')+
      (c.sitePassword? '<div class="detail-row"><span class="k">현장 비밀번호</span><span class="v">'+escapeHtml(c.sitePassword)+'</span></div>' : '')+
      (c.entrancePassword? '<div class="detail-row"><span class="k">1층 출입 비밀번호</span><span class="v">'+escapeHtml(c.entrancePassword)+'</span></div>' : '')+
      (c.onenoteLink? '<div class="detail-row"><span class="k">원노트</span><span class="v"><a href="'+escapeHtml(c.onenoteLink)+'" target="_blank" rel="noopener" class="onenote-link">📝 상담 메모 열기 →</a></span></div>' : '')+
      '<div class="detail-row"><span class="k">유입경로</span><span class="v">'+escapeHtml(c.source||'-')+'</span></div>'+
      '<div class="detail-row"><span class="k">등록일</span><span class="v">'+(c.createdAt?c.createdAt.slice(0,10):'-')+'</span></div>';
  if(c.memo){ html += '<div class="detail-section-title">메모</div><div class="detail-memo">'+escapeHtml(c.memo)+'</div>'; }
  html += '<div class="detail-section-title">관련 프로젝트 ('+custProjects.length+')</div>';
  if(custProjects.length===0){ html += '<div class="empty-note">없음</div>'; }
  else { custProjects.forEach(p=>{ html += '<div class="mini-cust"><div class="mini-cust-name">'+escapeHtml(p.name)+'</div><span class="tag tag-'+p.stage+'">'+STAGES.find(s=>s.id===p.stage).label+'</span></div>'; }); }
  html += '<div class="detail-section-title">최근 일정 ('+custEvents.length+')</div>';
  if(custEvents.length===0){ html += '<div class="empty-note">없음</div>'; }
  else { custEvents.forEach(e=>{ html += '<div class="agenda-item"><div class="agenda-time num" style="width:70px;">'+fmtDate(e.date)+'</div><div class="agenda-title">'+escapeHtml(e.title)+'</div></div>'; }); }
  html += '<div class="detail-section-title">견적서</div>'+
    '<div id="detail-quotes-list"><div class="empty-note">불러오는 중…</div></div>';
  html += '<div class="detail-actions">'+
    '<button class="btn btn-ghost" id="btn-edit-customer">정보 수정</button>'+
    '<button class="btn btn-primary" id="btn-add-event-for-customer">+ 일정 추가</button>'+
  '</div>'+
  '<div class="detail-actions" style="margin-top:8px;">'+
    '<button class="btn btn-primary" id="btn-new-quote-for-customer" style="flex:1;">+ 새 견적 작성</button>'+
  '</div>';
  html += '</div>';
  $detailRoot.innerHTML = html;
  document.getElementById('detail-close').addEventListener('click', closeDetail);
  document.getElementById('detail-backdrop').addEventListener('click', closeDetail);
  document.getElementById('btn-edit-customer').addEventListener('click', ()=> openCustomerModal(c.id));
  document.getElementById('btn-new-quote-for-customer').addEventListener('click', ()=> goToEstimateForCustomer(c, null));
  loadCustomerQuotesIntoDetail(c);
  document.getElementById('btn-add-event-for-customer').addEventListener('click', ()=>{
    closeDetail();
    openEventModal(null, todayISO());
    setTimeout(()=>{ const sel=document.getElementById('f-customer'); if(sel) sel.value=c.id; }, 0);
  });
}
function closeDetail(){ $detailRoot.innerHTML = ''; }

/* ============ Init ============ */
sb.auth.onAuthStateChange(function(event, session){
  if(event === 'PASSWORD_RECOVERY'){
    showNewPasswordScreen();
  }
});
(async function initAuth(){
  document.getElementById('login-screen').style.display = 'flex';
  // 비밀번호 재설정 링크는 두 가지 형태로 올 수 있어요: #...type=recovery (구형) 또는 ?code=... (신형/PKCE)
  const isRecoveryHash = window.location.hash.includes('type=recovery');
  const urlCode = new URLSearchParams(window.location.search).get('code');
  if(urlCode){
    try{
      const { data, error } = await sb.auth.exchangeCodeForSession(window.location.href);
      window.history.replaceState({}, document.title, window.location.pathname);
      if(!error && data && data.session){
        showNewPasswordScreen();
        return;
      }
    }catch(e){ /* 아래 일반 로그인 흐름으로 계속 진행 */ }
  }
  const { data: { session } } = await sb.auth.getSession();
  if(isRecoveryHash){
    showNewPasswordScreen();
    return;
  }
  if(session && session.user){
    await checkApprovalAndBoot(session.user);
  }
})();

document.getElementById('signup-btn').addEventListener('click', attemptSignup);
document.getElementById('pending-logout-btn').addEventListener('click', function(){ sb.auth.signOut(); showLoginForm(); });

document.getElementById('forgot-send-btn').addEventListener('click', sendForgotEmail);
document.getElementById('forgot-back-btn').addEventListener('click', showLoginForm);
document.getElementById('newpw-save-btn').addEventListener('click', saveNewPassword);
document.getElementById('login-pw').addEventListener('keydown', function(e){ if(e.key==='Enter') attemptLogin(); });
document.getElementById('login-id').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('login-pw').focus(); });
