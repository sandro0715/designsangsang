<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디자인상상 · 주방 견적 계산기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1E8;
  --surface:#FFFFFF;
  --surface-2:#FBF9F3;
  --ink:#221F19;
  --ink-dim:#6E6656;
  --ink-faint:#A79E8B;
  --line:#E2DBC8;
  --line-strong:#CFC5AA;
  --accent:#7B5A34;
  --accent-deep:#4E3A21;
  --accent-soft:#EFE4CE;
  --pine:#20301F;
  --pine-2:#2C4429;
  --radius:10px;
  --shadow:0 1px 2px rgba(34,31,25,.06), 0 8px 24px -10px rgba(34,31,25,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.num,.mono{font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

.topbar{
  background:var(--accent-deep); color:#F2EEDF; padding:18px 28px;
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; border-bottom:3px solid var(--accent);
}
.topbar .brand-mark{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; border:1px solid rgba(242,238,223,.4); padding:3px 7px; border-radius:4px; opacity:.85;}
.topbar h1{font-size:19px; font-weight:800; margin:0; letter-spacing:-.01em;}
.topbar .sub{font-size:12.5px; color:rgba(242,238,223,.68); margin-left:auto;}

.meta-bar{
  background:var(--surface); border-bottom:1px solid var(--line); padding:14px 28px;
  display:grid; grid-template-columns:repeat(3,minmax(150px,1fr)); gap:14px 22px;
}
.meta-field label{display:block; font-size:10.5px; letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:4px; font-weight:600;}
.meta-field input{width:100%; border:none; border-bottom:1.5px solid var(--line-strong); background:transparent; padding:3px 2px 6px; font-size:14.5px; color:var(--ink); font-weight:600;}
.meta-field input:focus{outline:none; border-bottom-color:var(--accent);}

.layout{display:grid; grid-template-columns:1fr 340px; gap:0; align-items:start;}
.main{padding:26px 30px 80px; min-width:0;}
.summary{position:sticky; top:0; height:100vh; overflow-y:auto; border-left:1px solid var(--line); background:var(--surface); padding:22px 20px 30px;}

.section{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px 20px; margin-bottom:16px;
}
.section-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.section-no{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; width:24px; height:24px;
  border-radius:6px; background:var(--accent-soft); color:var(--accent-deep);
  display:flex; align-items:center; justify-content:center; flex:none;
}
.section-title{font-size:14.5px; font-weight:800;}
.section-desc{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}

.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.field{margin-bottom:2px;}
.field label{display:block; font-size:11.5px; font-weight:700; color:var(--ink-dim); margin-bottom:6px;}
.field .len-input-wrap{display:flex; align-items:center; gap:6px;}
.field input[type=number]{
  width:100%; padding:9px 11px; border:1.3px solid var(--line-strong); border-radius:8px; font-size:14px; background:#fff;
}
.field input[type=number]:focus{outline:none; border-color:var(--accent);}
.unit-suffix{font-size:12px; color:var(--ink-faint); flex:none;}

.opt-list{display:flex; flex-direction:column; gap:6px;}
.opt-row{
  display:flex; align-items:center; gap:10px; padding:9px 11px;
  border:1.3px solid var(--line); border-radius:8px; background:var(--surface-2);
}
.opt-row.selected{border-color:var(--accent); background:var(--accent-soft);}
.opt-row input[type=radio], .opt-row input[type=checkbox]{accent-color:var(--accent); width:16px; height:16px; flex:none;}
.opt-row .opt-label{flex:1; font-size:13px; font-weight:600; cursor:pointer;}
.opt-row .opt-price{
  font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); display:flex; align-items:center; gap:3px;
}
.opt-price input{
  width:88px; padding:5px 7px; border:1.3px solid var(--line-strong); border-radius:6px; text-align:right; font-size:12px; background:#fff;
}
.opt-price-unit{color:var(--ink-faint); font-size:11px;}

.qty-mini{display:flex; align-items:center; gap:6px;}
.qty-mini input{width:60px; padding:6px 7px; border:1.3px solid var(--line-strong); border-radius:6px; text-align:center; font-size:12.5px;}

.section-subtotal{
  display:flex; justify-content:flex-end; gap:8px; padding-top:10px; margin-top:4px;
  border-top:1px dashed var(--line); font-size:12px; color:var(--ink-dim);
}
.section-subtotal b{color:var(--accent-deep); font-family:'JetBrains Mono',monospace;}

/* Summary panel (shared look with estimate calc) */
.summary-title{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; margin-bottom:14px;}
.summary-list{list-style:none; margin:0 0 14px; padding:0;}
.summary-list li{display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; font-size:12.5px; color:var(--ink-dim); border-bottom:1px dashed var(--line);}
.summary-list li .amt{font-family:'JetBrains Mono',monospace; color:var(--ink); font-weight:600;}
.summary-list li.strong{font-weight:700; color:var(--ink);}
.summary-list li.indent{padding-left:10px; font-size:12px; color:var(--ink-faint);}

.total-card{margin-top:16px; background:linear-gradient(155deg,var(--pine),var(--pine-2)); color:#F2EEDF; border-radius:12px; padding:18px 18px 20px;}
.total-card .label{font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:.72; font-weight:700; margin-bottom:6px;}
.total-card .value{font-family:'JetBrains Mono',monospace; font-size:27px; font-weight:800; letter-spacing:-.01em;}
.total-card .vat-note{font-size:11px; opacity:.6; margin-top:6px;}

.breakdown{margin-top:18px;}
.breakdown-title{font-size:11px; color:var(--ink-faint); font-weight:700; margin-bottom:8px; text-transform:uppercase; letter-spacing:.06em;}
.breakdown-row{display:flex; justify-content:space-between; font-size:11.5px; padding:5px 0; color:var(--ink-dim);}
.breakdown-row .amt{font-family:'JetBrains Mono',monospace;}
.breakdown-row.zero{opacity:.4;}

.action-row{display:flex; gap:8px; margin-top:18px;}
.btn-secondary{flex:1; background:var(--surface-2); border:1.3px solid var(--line-strong); color:var(--ink); padding:10px 8px; border-radius:8px; font-size:12.5px; font-weight:700;}
.btn-secondary:hover{background:var(--accent-soft); border-color:var(--accent);}
.btn-primary{flex:1; background:var(--ink); color:#fff; border:none; padding:10px 8px; border-radius:8px; font-size:12.5px; font-weight:700;}
.btn-primary:hover{background:var(--accent-deep);}
.footnote{margin-top:16px; font-size:10.8px; color:var(--ink-faint); line-height:1.55; border-top:1px solid var(--line); padding-top:12px;}

/* Print */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:24px; font-size:12px;}
  .p-title{font-size:20px; font-weight:800; text-align:center; letter-spacing:.3em; margin-bottom:4px;}
  .p-sub{text-align:center; font-size:10px; color:#666; margin-bottom:18px;}
  .p-meta{display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; font-size:11px; margin-bottom:16px; border:1px solid #999; padding:10px 14px; border-radius:6px;}
  .p-meta div span{color:#666;}
  table.p-table{width:100%; border-collapse:collapse; margin-bottom:4px;}
  table.p-table th, table.p-table td{border:1px solid #ccc; padding:5px 7px; font-size:11px;}
  table.p-table th{background:#eee;}
  .p-right{text-align:right;}
  .p-totals{width:320px; margin-left:auto; margin-top:12px; border-collapse:collapse;}
  .p-totals td{padding:5px 8px; font-size:11.5px; border-bottom:1px solid #ddd;}
  .p-totals tr.final td{font-weight:800; font-size:14px; border-top:2px solid #222; border-bottom:none;}
  .p-note{margin-top:18px; font-size:10px; color:#777; line-height:1.6;}
}

@media (max-width:980px){
  .layout{grid-template-columns:1fr;}
  .summary{position:static; height:auto; border-left:none; border-top:1px solid var(--line);}
  .field-grid{grid-template-columns:1fr;}
}

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <span class="brand-mark">DESIGN SANGSANG</span>
    <h1>주방 견적 계산기</h1>
    <span class="sub">독립 버전 · 아직 전체 견적서와 연동되지 않음</span>
  </header>

  <div class="meta-bar">
    <div class="meta-field"><label>프로젝트 / 공사명</label><input type="text" data-meta="project" placeholder="예: OO아파트 주방 리모델링"></div>
    <div class="meta-field"><label>고객명</label><input type="text" data-meta="customer" placeholder="고객님 성함"></div>
    <div class="meta-field"><label>견적일</label><input type="date" data-meta="date"></div>
  </div>

  <div class="layout">
    <main class="main" id="main-content"></main>
    <aside class="summary" id="summary-content"></aside>
  </div>
</div>

<div id="printArea"></div>

<script>
/* ============ Pricing data (editable defaults) ============ */
const DOOR_TIERS = [
  {id:'pet-matte', label:'PET 무광 (기본형)', lower:180000, upper:175000},
  {id:'pet-gloss', label:'PET 유광', lower:200000, upper:195000},
  {id:'paint-matte', label:'도장 (무광)', lower:320000, upper:300000},
  {id:'paint-gloss', label:'도장 (유광)', lower:350000, upper:330000},
  {id:'veneer', label:'원목무늬목', lower:420000, upper:400000},
];
const COUNTER_MATS = [
  {id:'artificial', label:'인조대리석 (기본형)', price:180000},
  {id:'himacs', label:'하이막스 (아크릴계열)', price:237500},
  {id:'ceramic', label:'세라믹 상판', price:380000},
  {id:'marble', label:'천연대리석', price:450000},
  {id:'steel', label:'스테인리스', price:320000},
];
const SINK_TYPES = [
  {id:'steel-under', label:'스텐 언더싱크 (기본형)', price:180000},
  {id:'steel-over', label:'스텐 오버싱크', price:150000},
  {id:'ceramic', label:'세라믹 싱크볼', price:350000},
  {id:'quartz', label:'쿼츠 싱크볼', price:420000},
];
const FAUCET_TYPES = [
  {id:'basic', label:'기본 수전', price:125000},
  {id:'pullout', label:'고급 수전 (풀아웃)', price:280000},
  {id:'filtered', label:'정수기 겸용 수전', price:450000},
];
const COOKTOP_TYPES = [
  {id:'none', label:'미포함', price:0},
  {id:'gas', label:'가스레인지 (매립형)', price:250000},
  {id:'halogen', label:'하이라이트 쿡탑', price:350000},
  {id:'induction', label:'인덕션 쿡탑', price:650000},
];
const APPLIANCES = [
  {id:'hood', label:'빌트인 후드', price:187500, defaultOn:true},
  {id:'dishwasher', label:'식기세척기 (빌트인)', price:850000, defaultOn:false},
  {id:'microwave', label:'전자레인지장 (매립)', price:120000, defaultOn:false},
  {id:'oven', label:'오븐 (빌트인)', price:950000, defaultOn:false},
];

const SHAPES = [
  {id:'i', label:'일자형'},
  {id:'l', label:'ㄱ자형'},
  {id:'u', label:'ㄷ자형'},
];
const SHAPE_DEFS = {
  i: { dirs:[[1,0]] },
  l: { dirs:[[1,0],[0,1]] },
  u: { dirs:[[0,1],[1,0],[0,-1]] },
};
const SHAPE_NORMALS = {
  i: [[0,1]],
  l: [[0,1],[-1,0]],
  u: [[1,0],[0,-1],[-1,0]],
};

const IND_GEN = 0.025, IND_MISC = 0.010, VAT = 0.10;

/* ============ State ============ */
const state = {
  segLens: [3600], upperLenOverride: null, wall2Side: 'left',
  counterLenOverride: null,
  shape: 'i',
  lowerDepthMM: 600, upperDepthMM: 320, counterDepthMM: 600,
  islandLen: 0, islandShape: 'i', islandLeg2: 1000, islandExtendMM: 0,
  diagramView: 'plan', frontWallIdx: 0, sideRef: 'wall',
  doorTier: 'pet-matte',
  counterMat: 'himacs',
  handleless: false, softClose: false, motorDrawerQty: 0,
  sinkType: 'steel-under',
  faucetType: 'basic',
  cooktop: 'none',
  appliancesOn: {},
  fridgeQty: 0, tallQty: 0,
  ledOn: false, outletQty: 0, pantryQty: 0,
  prices: {}, // overrides: door_lower_<id>, door_upper_<id>, counter_<id>, sink_<id>, faucet_<id>, cooktop_<id>, appl_<id>,
              // handleless, softclose, motordrawer, fridge, tall, led, outlet, pantry, island
  meta: { customer:'', project:'', date:new Date().toISOString().slice(0,10) },
};
APPLIANCES.forEach(a=>{ state.appliancesOn[a.id] = a.defaultOn; });

const ELEV = { kick:100, lowerBody:750, counterThk:30, gap:600, upperH:700 }; // mm, schematic standard heights

const BASE_PRICES = {
  handleless: 45000, softclose: 25000, motordrawer: 180000,
  fridge: 187500, tall: 350000, led: 15000, outlet: 45000, pantry: 280000, island: 320000,
};

/* ============ Helpers ============ */
function won(n){ n = Math.round(n||0); return n.toLocaleString('ko-KR'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function priceOf(key, fallback){ return state.prices[key] !== undefined ? state.prices[key] : fallback; }
function setPrice(key, val){ state.prices[key] = Number(val)||0; }
function round1(n){ return Math.round(n*10)/10; }
// All raw length state (segLens, upperLen, islandLen, islandLeg2, counterLenOverride) is
// stored in millimeters. Pricing is denominated per meter, so the *M helpers below convert
// down to meters at the point of use; MM helpers stay in millimeters for display/geometry.
function totalLowerLenMM(){ return state.segLens.reduce((a,b)=>a+(b||0),0); }
function cornerCount(){ return Math.max(state.segLens.length-1, 0); }
function buildWallSegments(){
  // Wall 1 (segLens[0]) is always the fixed main wall. wall2Side controls which
  // end of Wall 1 the second wall attaches to; for U-shape the third wall
  // automatically takes the other end. Segments always meet at true shared
  // corner points, so overlap/seam geometry stays correct regardless of layout.
  const L = state.segLens.map(v=>(v||0)/1000);
  const wall2Left = state.wall2Side !== 'right';
  const main = {start:{x:0,y:0}, end:{x:L[0],y:0}, normal:[0,1], len:L[0], srcIdx:0};
  if(state.shape==='i') return [main];
  if(state.shape==='l'){
    const leg = wall2Left
      ? {start:{x:0,y:0}, end:{x:0,y:L[1]}, normal:[1,0], len:L[1], srcIdx:1}
      : {start:{x:L[0],y:0}, end:{x:L[0],y:L[1]}, normal:[-1,0], len:L[1], srcIdx:1};
    return [main, leg];
  }
  // u-shape
  const leftLen = wall2Left ? L[1] : L[2], rightLen = wall2Left ? L[2] : L[1];
  const leftIdx = wall2Left ? 1 : 2, rightIdx = wall2Left ? 2 : 1;
  const leftLeg = {start:{x:0,y:0}, end:{x:0,y:leftLen}, normal:[1,0], len:leftLen, srcIdx:leftIdx};
  const rightLeg = {start:{x:L[0],y:0}, end:{x:L[0],y:rightLen}, normal:[-1,0], len:rightLen, srcIdx:rightIdx};
  return [main, leftLeg, rightLeg];
}
function wallOutlinePoints(segs){
  if(state.shape==='i') return [segs[0].start, segs[0].end];
  if(state.shape==='l'){
    const [main, leg] = segs;
    const legAtStart = leg.start.x===main.start.x && leg.start.y===main.start.y;
    return legAtStart ? [leg.end, main.start, main.end] : [main.start, main.end, leg.end];
  }
  const [main, leftLeg, rightLeg] = segs;
  return [leftLeg.end, leftLeg.start, main.end, rightLeg.end];
}
function seamJoints(segs){
  if(state.shape==='i') return [];
  if(state.shape==='l') return [{point:segs[1].start, normals:[segs[0].normal, segs[1].normal]}];
  return [
    {point:segs[0].start, normals:[segs[1].normal, segs[0].normal]},
    {point:segs[0].end, normals:[segs[0].normal, segs[2].normal]},
  ];
}
function cornerOverlapMM(){
  // At each 90° corner, both adjoining runs "claim" a cabinet-depth's worth of
  // length that's really the same shared corner unit -- so naive summing double
  // counts it once per corner. Subtract it for the length actually billed.
  return cornerCount() * state.lowerDepthMM;
}
function upperCornerOverlapMM(){ return cornerCount() * state.upperDepthMM; }
function effectiveLowerLenMM(){ return Math.max(totalLowerLenMM() - cornerOverlapMM(), 0); }
function autoUpperLenMM(){ return Math.max(totalLowerLenMM() - upperCornerOverlapMM(), 0); }
function effectiveUpperLenMM(){ return state.upperLenOverride !== null ? state.upperLenOverride : autoUpperLenMM(); }
function totalLowerLen(){ return totalLowerLenMM()/1000; }
function cornerOverlapM(){ return cornerOverlapMM()/1000; }
function effectiveLowerLen(){ return effectiveLowerLenMM()/1000; }
function effectiveUpperLen(){ return effectiveUpperLenMM()/1000; }
function islandLenM(){ return state.islandLen/1000; }
function islandLenM(){ return state.islandLen/1000; }
function islandLeg2M(){ return state.islandLeg2/1000; }
function resizeSegLens(shapeId){
  const need = SHAPE_DEFS[shapeId].dirs.length;
  if(state.segLens.length === need) return;
  const total = totalLowerLenMM() || 3600;
  const r = v=>Math.round(v/10)*10;
  if(need===1) state.segLens = [r(total)];
  else if(need===2) state.segLens = [r(total*0.62), r(total*0.38)];
  else if(need===3) state.segLens = [r(total*0.33), r(total*0.34), r(total*0.33)];
}

/* ============ Compute ============ */
function counterLenMM(){ return state.counterLenOverride !== null ? state.counterLenOverride : effectiveLowerLenMM(); }
function counterLen(){ return counterLenMM()/1000; }

function computeBreakdown(){
  const items = [];
  const doorTier = DOOR_TIERS.find(d=>d.id===state.doorTier);
  const lowerPrice = priceOf('door_lower_'+doorTier.id, doorTier.lower);
  const upperPrice = priceOf('door_upper_'+doorTier.id, doorTier.upper);
  items.push({label:'하부장 ('+doorTier.label+')', qty:Math.round(effectiveLowerLenMM()), unit:'mm', unitPrice:lowerPrice, amt: effectiveLowerLen()*lowerPrice});
  items.push({label:'상부장 ('+doorTier.label+')', qty:Math.round(effectiveUpperLenMM()), unit:'mm', unitPrice:upperPrice, amt: effectiveUpperLen()*upperPrice});

  const cMat = COUNTER_MATS.find(c=>c.id===state.counterMat);
  const cPrice = priceOf('counter_'+cMat.id, cMat.price);
  items.push({label:'상판 ('+cMat.label+')', qty:Math.round(counterLenMM()), unit:'mm', unitPrice:cPrice, amt: counterLen()*cPrice});

  if(state.handleless){
    const p = priceOf('handleless', BASE_PRICES.handleless);
    const lenMM = effectiveLowerLenMM() + effectiveUpperLenMM();
    const lenM = effectiveLowerLen() + effectiveUpperLen();
    items.push({label:'무손잡이(핸들리스) 시스템', qty:Math.round(lenMM), unit:'mm', unitPrice:p, amt: lenM*p});
  }
  if(state.softClose){
    const p = priceOf('softclose', BASE_PRICES.softclose);
    const lenMM = effectiveLowerLenMM() + effectiveUpperLenMM();
    const lenM = effectiveLowerLen() + effectiveUpperLen();
    items.push({label:'소프트클로징 업그레이드', qty:Math.round(lenMM), unit:'mm', unitPrice:p, amt: lenM*p});
  }
  if(state.motorDrawerQty>0){
    const p = priceOf('motordrawer', BASE_PRICES.motordrawer);
    items.push({label:'전동 서랍', qty:state.motorDrawerQty, unit:'EA', unitPrice:p, amt: state.motorDrawerQty*p});
  }

  const sink = SINK_TYPES.find(s=>s.id===state.sinkType);
  const sinkP = priceOf('sink_'+sink.id, sink.price);
  items.push({label:'싱크볼 ('+sink.label+')', qty:1, unit:'식', unitPrice:sinkP, amt:sinkP});

  const faucet = FAUCET_TYPES.find(f=>f.id===state.faucetType);
  const faucetP = priceOf('faucet_'+faucet.id, faucet.price);
  items.push({label:'수전 ('+faucet.label+')', qty:1, unit:'식', unitPrice:faucetP, amt:faucetP});

  APPLIANCES.forEach(a=>{
    if(state.appliancesOn[a.id]){
      const p = priceOf('appl_'+a.id, a.price);
      items.push({label:a.label, qty:1, unit:'EA', unitPrice:p, amt:p});
    }
  });
  if(state.cooktop !== 'none'){
    const ct = COOKTOP_TYPES.find(c=>c.id===state.cooktop);
    const p = priceOf('cooktop_'+ct.id, ct.price);
    items.push({label:ct.label, qty:1, unit:'EA', unitPrice:p, amt:p});
  }

  if(state.fridgeQty>0){
    const p = priceOf('fridge', BASE_PRICES.fridge);
    items.push({label:'냉장고장 (제작)', qty:state.fridgeQty, unit:'EA', unitPrice:p, amt: state.fridgeQty*p});
  }
  if(state.tallQty>0){
    const p = priceOf('tall', BASE_PRICES.tall);
    items.push({label:'키큰장 (제작)', qty:state.tallQty, unit:'EA', unitPrice:p, amt: state.tallQty*p});
  }
  if(state.ledOn){
    const p = priceOf('led', BASE_PRICES.led);
    items.push({label:'하부 LED 간접조명', qty:Math.round(effectiveLowerLenMM()), unit:'mm', unitPrice:p, amt: effectiveLowerLen()*p});
  }
  if(state.outletQty>0){
    const p = priceOf('outlet', BASE_PRICES.outlet);
    items.push({label:'매립 콘센트 추가', qty:state.outletQty, unit:'EA', unitPrice:p, amt: state.outletQty*p});
  }
  if(state.pantryQty>0){
    const p = priceOf('pantry', BASE_PRICES.pantry);
    items.push({label:'팬트리장', qty:state.pantryQty, unit:'EA', unitPrice:p, amt: state.pantryQty*p});
  }
  if(state.islandLen>0){
    const p = priceOf('island', BASE_PRICES.island);
    items.push({label:'아일랜드 식탁', qty:state.islandLen, unit:'mm', unitPrice:p, amt: islandLenM()*p});
  }

  return items;
}
function computeTotals(){
  const items = computeBreakdown();
  const direct = items.reduce((s,it)=>s+it.amt, 0);
  const indGen = direct*IND_GEN, indMisc = direct*IND_MISC;
  const indirect = indGen+indMisc;
  const subtotal = direct+indirect;
  const vat = subtotal*VAT;
  const grand = subtotal+vat;
  return {items, direct, indGen, indMisc, indirect, subtotal, vat, grand};
}

/* ============ Kitchen layout diagram (line + surface floor-plan style) ============ */
function rectPoints(s, e, normal, depth){
  const d = {x: normal[0]*depth, y: normal[1]*depth};
  const c = {x:e.x+d.x, y:e.y+d.y}, f = {x:s.x+d.x, y:s.y+d.y};
  return [s,e,c,f].map(p=>p.x+','+p.y).join(' ');
}
function seamMarkerSVG(pt, angleDeg){
  // Short perpendicular tick across the counter band, marking a required slab joint.
  return '<g transform="translate('+pt.x+','+pt.y+') rotate('+angleDeg+')">'+
    '<line x1="-13" y1="0" x2="13" y2="0" stroke="#9C3B2E" stroke-width="2.5" stroke-dasharray="2 2"/>'+
    '<circle cx="0" cy="0" r="2.6" fill="#9C3B2E"/>'+
  '</g>';
}
function buildDiagramSVG(){
  if(state.diagramView==='front') return buildFrontSVG();
  if(state.diagramView==='side') return buildSideSVG();
  return buildPlanSVG();
}

function buildPlanSVG(){
  const totalLen = totalLowerLen();
  if(!totalLen || totalLen<=0){
    return '<div style="text-align:center; padding:40px 10px; color:var(--ink-faint); font-size:12.5px;">하부장 길이를 입력하면 다이어그램이 표시됩니다.</div>';
  }
  const segs = buildWallSegments();
  const lowerDepthM = state.lowerDepthMM/1000, upperDepthM = state.upperDepthMM/1000, counterDepthM = state.counterDepthMM/1000;

  const xsM = segs.flatMap(s=>[s.start.x,s.end.x]), ysM = segs.flatMap(s=>[s.start.y,s.end.y]);
  const spanXm = Math.max(...xsM) - Math.min(...xsM);
  const spanYm = Math.max(...ysM) - Math.min(...ysM);
  const isStraight = spanYm < 0.05 || spanXm < 0.05;
  const TARGET_PX = 300;
  const maxDepthM = Math.max(lowerDepthM, upperDepthM, counterDepthM);
  let scale = TARGET_PX / Math.max(spanXm, spanYm, 0.6);
  scale = Math.min(Math.max(scale, 28), 130);

  const lowerDepthPx = lowerDepthM*scale, upperDepthPx = upperDepthM*scale, counterDepthPx = counterDepthM*scale;
  const outerDepthPx = Math.max(lowerDepthPx, counterDepthPx);
  const labelOffsetPx = outerDepthPx + 24;

  const toPx = p=>({x:p.x*scale, y:p.y*scale});
  const segMeta = segs.map(s=>({start:toPx(s.start), end:toPx(s.end), len:s.len, normal:s.normal, srcIdx:s.srcIdx}));
  const outlinePx = wallOutlinePoints(segs).map(toPx);

  const xs = segMeta.flatMap(s=>[s.start.x,s.end.x]), ys = segMeta.flatMap(s=>[s.start.y,s.end.y]);
  const pad = Math.max(74, outerDepthPx+42);
  const padBottom = (isStraight && state.islandLen>0) ? pad+96 : pad;
  const minX = Math.min(...xs)-pad, maxX = Math.max(...xs)+pad;
  const minY = Math.min(...ys)-pad, maxY = Math.max(...ys)+padBottom;
  const w = maxX-minX, h = maxY-minY;
  const shift = p=>({x:p.x-minX, y:p.y-minY});

  const shiftedPts = segMeta.flatMap(s=>[s.start,s.end]).map(shift);
  const wallPath = outlinePx.map(shift).map(p=>p.x+','+p.y).join(' ');

  let lowerRects='', upperRects='', overhangRects='', counterLines='', labels='', seams='';
  segMeta.forEach((seg)=>{
    const s = shift(seg.start), e = shift(seg.end);
    const nx = seg.normal[0], ny = seg.normal[1];
    lowerRects += '<polygon points="'+rectPoints(s,e,[nx,ny],lowerDepthPx)+'" fill="#4E3A21" stroke="#2E2114" stroke-width="1"/>';
    // Counter overhang zone (counter deeper than the cabinet body beneath it)
    if(counterDepthPx > lowerDepthPx+1){
      const os = {x:s.x+nx*lowerDepthPx, y:s.y+ny*lowerDepthPx};
      const oe = {x:e.x+nx*lowerDepthPx, y:e.y+ny*lowerDepthPx};
      overhangRects += '<polygon points="'+rectPoints(os,oe,[nx,ny],counterDepthPx-lowerDepthPx)+'" fill="#EFE4CE" stroke="none"/>';
    }
    // Upper-cabinet outline uses the same true segment endpoints as the lower
    // cabinet fill, so adjacent walls' outlines correctly overlap at the corner
    // (sized to the upper cabinet's own depth) instead of an artificial inset.
    upperRects += '<polygon points="'+rectPoints(s,e,[nx,ny],upperDepthPx)+'" fill="none" stroke="#F2EEDF" stroke-width="2" stroke-dasharray="4 3"/>';
    counterLines += '<line x1="'+(s.x+nx*counterDepthPx)+'" y1="'+(s.y+ny*counterDepthPx)+'" x2="'+(e.x+nx*counterDepthPx)+'" y2="'+(e.y+ny*counterDepthPx)+'" stroke="#B08D57" stroke-width="2.5"/>';
    const mx=(s.x+e.x)/2, my=(s.y+e.y)/2;
    const mainTag = (state.segLens.length>1 && seg.srcIdx===0) ? ' ★메인벽' : '';
    labels += '<text x="'+(mx-nx*labelOffsetPx)+'" y="'+(my-ny*labelOffsetPx)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#4E3A21" font-family="JetBrains Mono, monospace">'+Math.round(seg.len*1000)+'mm'+mainTag+'</text>';
  });
  seamJoints(segs).forEach(j=>{
    const pt = shift(toPx(j.point));
    const [n1,n2] = j.normals;
    const jointDeg = Math.atan2(n1[1]+n2[1], n1[0]+n2[0]) * 180/Math.PI;
    seams += seamMarkerSVG(pt, jointDeg+90);
  });

  const islandR = buildIslandPlan(shift, {minX,minY}, scale, lowerDepthM, counterDepthM, isStraight, shiftedPts);

  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="230" style="display:block;">'+
    overhangRects + lowerRects + upperRects + counterLines +
    '<polyline points="'+wallPath+'" fill="none" stroke="#221F19" stroke-width="2.5" stroke-linecap="square"/>'+
    seams + islandR.html + labels +
  '</svg>'+
  '<div style="display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:6px; font-size:10px; color:var(--ink-faint);">'+
    '<span><span style="display:inline-block;width:14px;height:8px;background:#4E3A21;border-radius:2px;vertical-align:middle;margin-right:4px;"></span>하부장</span>'+
    '<span><span style="display:inline-block;width:14px;height:8px;background:transparent;border:1.5px dashed #F2EEDF;box-shadow:0 0 0 1px #CFC5AA;vertical-align:middle;margin-right:4px;"></span>상부장(투영)</span>'+
    '<span><span style="display:inline-block;width:14px;height:3px;background:#B08D57;vertical-align:middle;margin-right:4px;"></span>상판</span>'+
    '<span><span style="display:inline-block;width:14px;height:8px;background:#EFE4CE;border:1px solid #CFC5AA;vertical-align:middle;margin-right:4px;"></span>상판 오버행</span>'+
    '<span><span style="display:inline-block;width:14px;height:0;border-top:2px dashed #9C3B2E;vertical-align:middle;margin-right:4px;"></span>상판 접합부</span>'+
    (state.islandLen>0?'<span><span style="display:inline-block;width:10px;height:8px;border:1.5px dashed #7B5A34;background:#EFE4CE;vertical-align:middle;margin-right:4px;"></span>아일랜드</span>':'')+
  '</div>';
}

function buildIslandPlan(shift, shiftOrigin, scale, lowerDepthM, counterDepthM, isStraight, wallShiftedPts){
  if(!(state.islandLen>0)) return {html:''};
  const lowerDepthPx = lowerDepthM*scale, counterDepthPx = counterDepthM*scale;
  const extendPx = (state.islandExtendMM/1000)*scale;

  // Build island's own local segment list (own coordinate space, meters)
  const islandLenM_ = state.islandLen/1000, islandLeg2M_ = state.islandLeg2/1000;
  let segs;
  if(state.islandShape==='l' && state.islandLeg2>0){
    segs = [
      {s:{x:0,y:0}, e:{x:islandLenM_,y:0}, normal:[0,1], extend:0},
      {s:{x:islandLenM_,y:0}, e:{x:islandLenM_,y:islandLeg2M_}, normal:[1,0], extend:extendPx},
    ];
  } else {
    segs = [{s:{x:0,y:0}, e:{x:islandLenM_,y:0}, normal:[0,1], extend:extendPx}];
  }
  // scale to px (local space)
  segs = segs.map(sg=>({s:{x:sg.s.x*scale,y:sg.s.y*scale}, e:{x:sg.e.x*scale,y:sg.e.y*scale}, normal:sg.normal, extend:sg.extend}));

  const allX = segs.flatMap(sg=>[sg.s.x,sg.e.x]), allY = segs.flatMap(sg=>[sg.s.y,sg.e.y]);
  const localW = Math.max(...allX)-Math.min(...allX) || 1;
  const localH = Math.max(...allY)-Math.min(...allY) || 1;
  const maxCounterDepth = counterDepthPx + Math.max(...segs.map(sg=>sg.extend));
  const totalW = localW + maxCounterDepth, totalH = localH + maxCounterDepth;

  // available interior space in the main shape
  const shiftedXs = wallShiftedPts.map(p=>p.x), shiftedYs = wallShiftedPts.map(p=>p.y);
  const spanXpx = Math.max(...shiftedXs)-Math.min(...shiftedXs);
  const spanYpx = Math.max(...shiftedYs)-Math.min(...shiftedYs);
  const centerX = (Math.max(...shiftedXs)+Math.min(...shiftedXs))/2;
  let cx, cy, tooTight=false;
  if(isStraight){
    cx = centerX;
    cy = Math.max(...shiftedYs) + lowerDepthPx + totalH/2 + 34;
  } else {
    const centerY = (Math.max(...shiftedYs)+Math.min(...shiftedYs))/2;
    const maxW = spanXpx - lowerDepthPx*2.6, maxH = spanYpx - lowerDepthPx*2.0;
    if(totalW > maxW || totalH > maxH || maxW < 42 || maxH < 32) tooTight = true;
    cx = centerX; cy = centerY;
  }
  if(tooTight){
    return {html:'<text x="'+cx+'" y="'+cy+'" text-anchor="middle" font-size="10" font-weight="600" fill="#9C3B2E">공간이 좁아 아일랜드를 표시할 수 없어요</text>'};
  }

  // place island's local origin so its bounding box centers on (cx,cy)
  const originX = cx - localW/2, originY = cy - localH/2;
  const toGlobal = p=>({x:p.x+originX, y:p.y+originY});

  let html = '';
  segs.forEach((sg,i)=>{
    const s = toGlobal(sg.s), e = toGlobal(sg.e);
    const nx = sg.normal[0], ny = sg.normal[1];
    html += '<polygon points="'+rectPoints(s,e,[nx,ny],lowerDepthPx)+'" fill="#6B5236" stroke="#3E2E1B" stroke-width="1"/>';
    const cDepth = counterDepthPx + sg.extend;
    html += '<polygon points="'+rectPoints(s,e,[nx,ny],cDepth)+'" fill="none" stroke="#B08D57" stroke-width="2"/>';
    if(sg.extend>0){
      const os = {x:s.x+nx*counterDepthPx, y:s.y+ny*counterDepthPx}, oe = {x:e.x+nx*counterDepthPx, y:e.y+ny*counterDepthPx};
      html += '<polygon points="'+rectPoints(os,oe,[nx,ny],sg.extend)+'" fill="#F6EFDC" stroke="#B08D57" stroke-width="1.5" stroke-dasharray="3 2"/>';
      const mx=(os.x+oe.x)/2+nx*sg.extend/2, my=(os.y+oe.y)/2+ny*sg.extend/2;
      html += '<text x="'+mx+'" y="'+my+'" text-anchor="middle" font-size="9" font-weight="700" fill="#9C3B2E">+'+state.islandExtendMM+'mm 바</text>';
    }
    if(i < segs.length-1){
      html += seamMarkerSVG(e, 90);
    }
  });
  html += '<text x="'+(originX+localW/2)+'" y="'+(originY-8)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4E3A21">아일랜드</text>';
  return {html};
}

/* ============ Front / side elevation views ============ */
function segmentLengths(){
  return state.segLens.map(v=>v/1000); // mm -> m, for the elevation scale math below
}
function elevLegend(items){
  return '<div style="display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:6px; font-size:10px; color:var(--ink-faint);">'+items+'</div>';
}
function buildFrontSVG(){
  const lens = segmentLengths();
  const idx = Math.min(state.frontWallIdx, lens.length-1);
  const lenM = lens[idx];
  if(!lenM || lenM<=0){
    return '<div style="text-align:center; padding:40px 10px; color:var(--ink-faint); font-size:12.5px;">하부장 길이를 입력하면 정면도가 표시됩니다.</div>';
  }
  const H = ELEV.kick+ELEV.lowerBody+ELEV.counterThk+ELEV.gap+ELEV.upperH;
  const scaleY = 190/H;
  // Use ONE fixed px/m scale derived from the longest wall (not the currently
  // shown one), so switching between walls actually shows their real relative
  // size instead of every wall being auto-stretched to fill the same width.
  const maxLenM = Math.max(...lens, 0.6);
  const scaleX = Math.min(Math.max(300/maxLenM, 40), 200);
  const widthPx = lenM*scaleX;
  const padX = 60, padTop = 44, padBottom = 26;
  const w = maxLenM*scaleX+padX*2, h = H*scaleY+padTop+padBottom;
  const x0 = padX, floorY = h-padBottom;

  const bands = [
    {mm:ELEV.kick, color:'#CFC5AA', label:'걸레받이 '+ELEV.kick+'mm'},
    {mm:ELEV.lowerBody, color:'#4E3A21', label:'하부장 '+ELEV.lowerBody+'mm'},
    {mm:ELEV.counterThk, color:'#B08D57', label:'상판 '+ELEV.counterThk+'mm'},
    {mm:ELEV.gap, color:'#FBF9F3', label:'백스플래시 '+ELEV.gap+'mm'},
    {mm:ELEV.upperH, color:'#7B5A34', label:'상부장(벽장) '+ELEV.upperH+'mm'},
  ];
  let y = floorY, rects='', labels='';
  bands.forEach(b=>{
    const bh = b.mm*scaleY;
    rects += '<rect x="'+x0+'" y="'+(y-bh)+'" width="'+widthPx+'" height="'+bh+'" fill="'+b.color+'" stroke="#221F19" stroke-width="0.8"/>';
    labels += '<text x="'+(x0-8)+'" y="'+(y-bh/2+4)+'" text-anchor="end" font-size="10" font-weight="700" fill="#4E3A21" font-family=\'JetBrains Mono, monospace\'>'+b.mm+'</text>';
    y -= bh;
  });
  const wallSel = lens.length>1 ? ('<div style="text-align:center; font-size:11px; color:var(--ink-dim); margin-top:6px;">벽면 '+(idx+1)+' / '+lens.length+' · '+Math.round(lenM*1000)+'mm 기준</div>') : '';

  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="230" style="display:block;">'+
    '<text x="'+(x0+widthPx/2)+'" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#4E3A21" font-family=\'JetBrains Mono, monospace\'>'+Math.round(lenM*1000)+'mm</text>'+
    rects + labels +
    '<line x1="'+x0+'" y1="'+floorY+'" x2="'+(x0+widthPx)+'" y2="'+floorY+'" stroke="#221F19" stroke-width="2"/>'+
  '</svg>' + wallSel +
  elevLegend(
    '<span><span style="display:inline-block;width:14px;height:8px;background:#4E3A21;border-radius:2px;vertical-align:middle;margin-right:4px;"></span>하부장</span>'+
    '<span><span style="display:inline-block;width:14px;height:8px;background:#7B5A34;border-radius:2px;vertical-align:middle;margin-right:4px;"></span>상부장</span>'+
    '<span><span style="display:inline-block;width:14px;height:3px;background:#B08D57;vertical-align:middle;margin-right:4px;"></span>상판</span>'
  );
}

function buildSideSVG(){
  let depthCabMM, depthCounterMM, depthUpperMM, refLabel;
  const hasIslandBar = state.islandLen>0 && state.islandExtendMM>0;
  const ref = state.sideRef;
  if(ref==='island-bar' && hasIslandBar){
    depthCabMM = state.lowerDepthMM; depthCounterMM = state.counterDepthMM+state.islandExtendMM; depthUpperMM = 0;
    refLabel = '아일랜드 · 바 확장 구간';
  } else if(ref==='island-base' && state.islandLen>0){
    depthCabMM = state.lowerDepthMM; depthCounterMM = state.counterDepthMM; depthUpperMM = 0;
    refLabel = '아일랜드 · 기본 구간';
  } else {
    depthCabMM = state.lowerDepthMM; depthCounterMM = state.counterDepthMM; depthUpperMM = state.upperDepthMM;
    refLabel = '벽면 기준';
  }
  const maxDepthMM = Math.max(depthCabMM, depthCounterMM, depthUpperMM, 400);
  const H = ELEV.kick+ELEV.lowerBody+ELEV.counterThk+ELEV.gap+ELEV.upperH;
  // Use one unified px/mm scale for both axes so the elevation is proportionally
  // accurate (previously depth and height used different ratios, looking distorted).
  const scale = Math.min(260/maxDepthMM, 190/H);
  const scaleX = scale, scaleY = scale;
  const padL = 50, padTop = 40, padBottom = 26, padR = 40;
  const w = maxDepthMM*scaleX+padL+padR, h = H*scaleY+padTop+padBottom;
  const x0 = padL, floorY = h-padBottom;

  const kickH = ELEV.kick*scaleY, bodyH = ELEV.lowerBody*scaleY, counterH = Math.max(ELEV.counterThk*scaleY,5);
  const bodyTopY = floorY-kickH-bodyH;
  const counterTopY = bodyTopY-counterH;
  const upperBotY = counterTopY-ELEV.gap*scaleY;
  const upperH = ELEV.upperH*scaleY;

  const cabW = depthCabMM*scaleX, counterW = depthCounterMM*scaleX, upperW = depthUpperMM*scaleX;

  let html = '';
  // kick (inset slightly from face)
  html += '<rect x="'+x0+'" y="'+(floorY-kickH)+'" width="'+Math.max(cabW-16,10)+'" height="'+kickH+'" fill="#CFC5AA"/>';
  // lower cabinet body
  html += '<rect x="'+x0+'" y="'+bodyTopY+'" width="'+cabW+'" height="'+bodyH+'" fill="#4E3A21" stroke="#221F19" stroke-width="1"/>';
  // counter (may overhang beyond cabinet)
  html += '<rect x="'+x0+'" y="'+counterTopY+'" width="'+counterW+'" height="'+counterH+'" fill="#B08D57" stroke="#221F19" stroke-width="1"/>';
  if(counterW > cabW+2){
    html += '<rect x="'+(x0+cabW)+'" y="'+counterTopY+'" width="'+(counterW-cabW)+'" height="'+counterH+'" fill="#F6EFDC" stroke="#9C3B2E" stroke-width="1.2" stroke-dasharray="3 2"/>';
    html += '<text x="'+(x0+cabW+(counterW-cabW)/2)+'" y="'+(counterTopY-8)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9C3B2E">오버행 '+(depthCounterMM-depthCabMM)+'mm</text>';
  }
  // upper cabinet (if applicable)
  if(upperW>0){
    html += '<rect x="'+x0+'" y="'+(upperBotY-upperH)+'" width="'+upperW+'" height="'+upperH+'" fill="none" stroke="#7B5A34" stroke-width="2" stroke-dasharray="4 3"/>';
    html += '<text x="'+(x0+upperW/2)+'" y="'+(upperBotY-upperH-8)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7B5A34">벽장 '+depthUpperMM+'mm</text>';
  }
  // wall + floor lines
  html += '<line x1="'+x0+'" y1="'+padTop+'" x2="'+x0+'" y2="'+floorY+'" stroke="#221F19" stroke-width="2.5"/>';

function section(no, title, desc, bodyHtml){
  return '<div class="section"><div class="section-head"><span class="section-no">'+no+'</span>'+
    '<div><div class="section-title">'+title+'</div>'+(desc?'<div class="section-desc">'+desc+'</div>':'')+'</div></div>'+
    bodyHtml+'</div>';
}
function segLenFieldsHTML(){
  const labels = state.shape==='i' ? ['하부장 길이'] : state.segLens.map((_,i)=>'벽면 '+(i+1)+' 길이'+(i===0&&state.segLens.length>1?' (메인벽·싱크대)':''));
  return state.segLens.map((len,i)=>
    '<div class="field"><label>'+labels[i]+'</label><div class="len-input-wrap"><input type="number" step="10" min="0" id="f-seg'+i+'" value="'+len+'"><span class="unit-suffix">mm</span></div></div>'
  ).join('');
}
function segSumLabelText(){
  const raw = totalLowerLenMM(), overlap = cornerOverlapMM(), eff = effectiveLowerLenMM();
  if(overlap<=0) return '하부장 합계: '+Math.round(raw)+'mm';
  return '벽면 합계 '+Math.round(raw)+'mm − 코너 겹침 '+Math.round(overlap)+'mm(하부장 깊이 기준) = 과금 길이 '+Math.round(eff)+'mm';
}
function upperSumLabelText(){
  const overlap = upperCornerOverlapMM();
  if(overlap<=0) return '';
  if(state.upperLenOverride !== null){
    return '직접 입력값 사용 중: '+Math.round(state.upperLenOverride)+'mm (자동 계산을 쓰려면 값을 지우세요)';
  }
  return '벽면 합계 '+Math.round(totalLowerLenMM())+'mm − 코너 겹침 '+Math.round(overlap)+'mm(벽장 깊이 기준) = 과금 길이 '+Math.round(autoUpperLenMM())+'mm (자동 계산)';
}
function viewTabBtn(id, label){
  const active = state.diagramView===id;
  return '<button class="btn-secondary" data-view-tab="'+id+'" style="flex:1; '+(active?'background:var(--accent);color:#fff;border-color:var(--accent);':'')+'">'+label+'</button>';
}
function checkRow(checkKey, label, checked, priceKey, priceVal, unitLabel){
  return '<div class="opt-row'+(checked?' selected':'')+'">'+
    '<input type="checkbox" id="chk-'+checkKey+'" data-check-key="'+checkKey+'" '+(checked?'checked':'')+'>'+
    '<label class="opt-label" for="chk-'+checkKey+'">'+escapeHtml(label)+'</label>'+
    '<span class="opt-price"><input type="number" data-price-key="'+priceKey+'" value="'+priceVal+'"><span class="opt-price-unit">'+unitLabel+'</span></span>'+
  '</div>';
}

function bindMainEvents(){
  // length / qty inputs
  const bindNum = (id, setter)=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', ()=>{
      setter(el.value === '' ? null : Number(el.value));
      renderSummaryOnly();
      updateDiagram();
    });
  };
  state.segLens.forEach((_,i)=>{
    bindNum('f-seg'+i, v=>{
      state.segLens[i] = v||0;
      const lbl = document.getElementById('seg-sum-label');
      if(lbl) lbl.textContent = segSumLabelText();
      const counterInput = document.getElementById('f-counterLen');
      if(counterInput) counterInput.placeholder = Math.round(effectiveLowerLenMM());
      const upperLbl = document.getElementById('upper-sum-label');
      if(upperLbl) upperLbl.textContent = '벽장: '+upperSumLabelText();
      const upperInput = document.getElementById('f-upperLen');
      if(upperInput) upperInput.placeholder = Math.round(autoUpperLenMM());
    });
  });
  bindNum('f-upperLen', v=>{
    state.upperLenOverride = v;
    const lbl = document.getElementById('upper-sum-label');
    if(lbl) lbl.textContent = '벽장: '+upperSumLabelText();
  });
  bindNum('f-counterLen', v=>state.counterLenOverride = v);
  bindNum('f-fridgeQty', v=>state.fridgeQty = v||0);
  bindNum('f-tallQty', v=>state.tallQty = v||0);
  bindNum('f-motorDrawerQty', v=>state.motorDrawerQty = v||0);
  bindNum('f-outletQty', v=>state.outletQty = v||0);
  bindNum('f-pantryQty', v=>state.pantryQty = v||0);
  bindNum('f-lowerDepthMM', v=>state.lowerDepthMM = v||0);
  bindNum('f-upperDepthMM', v=>state.upperDepthMM = v||0);
  bindNum('f-counterDepthMM', v=>state.counterDepthMM = v||0);
  bindNum('f-islandLeg2', v=>state.islandLeg2 = v||0);
  bindNum('f-islandExtendMM', v=>state.islandExtendMM = v||0);

  // islandLen also toggles extra UI (shape/leg2/extend controls) into or out of
  // existence, so it needs a full re-render when it crosses the 0 <-> >0 boundary --
  // but only then, so ordinary typing keeps its lightweight (focus-preserving) path.
  const islandLenEl = document.getElementById('f-islandLen');
  if(islandLenEl){
    islandLenEl.addEventListener('input', ()=>{
      const wasOn = state.islandLen>0;
      state.islandLen = islandLenEl.value === '' ? 0 : Number(islandLenEl.value);
      const isOn = state.islandLen>0;
      if(wasOn !== isOn){
        render();
      } else {
        renderSummaryOnly();
        updateDiagram();
      }
    });
  }

  // radio groups
  ['doorTier','counterMat','sinkType','faucetType','cooktop','shape'].forEach(name=>{
    document.querySelectorAll('input[name="'+name+'"]').forEach(r=>{
      r.addEventListener('change', e=>{
        state[name] = e.target.value;
        if(name==='shape'){ state.frontWallIdx = 0; resizeSegLens(e.target.value); }
        render();
      });
    });
  });
  document.querySelectorAll('input[name="islandShape"]').forEach(r=>{
    r.addEventListener('change', e=>{ state.islandShape = e.target.value; render(); });
  });
  document.querySelectorAll('input[name="wall2Side"]').forEach(r=>{
    r.addEventListener('change', e=>{ state.wall2Side = e.target.value; render(); });
  });
  document.querySelectorAll('input[name="sideRef"]').forEach(r=>{
    r.addEventListener('change', e=>{ state.sideRef = e.target.value; updateDiagram(); });
  });

  // diagram view tabs + front-wall selector
  document.querySelectorAll('[data-view-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.diagramView = btn.dataset.viewTab; render(); });
  });
  document.querySelectorAll('[data-front-wall]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.frontWallIdx = parseInt(btn.dataset.frontWall,10); render(); });
  });

  // checkboxes
  document.querySelectorAll('[data-check-key]').forEach(el=>{
    el.addEventListener('change', e=>{
      const key = e.target.dataset.checkKey;
      if(key==='handleless') state.handleless = e.target.checked;
      else if(key==='softClose') state.softClose = e.target.checked;
      else if(key==='ledOn') state.ledOn = e.target.checked;
      else if(key.startsWith('appl_')) state.appliancesOn[key.slice(5)] = e.target.checked;
      render();
    });
  });

  // price override inputs
  document.querySelectorAll('[data-price-key]').forEach(el=>{
    el.addEventListener('input', e=>{
      setPrice(e.target.dataset.priceKey, e.target.value);
      renderSummaryOnly();
    });
  });
}
/* ============ Summary ============ */
function renderSummary(t){
  let html = '<div class="summary-title">주방 견적 요약</div>';
  html += '<ul class="summary-list">';
  html += '<li class="strong">직접 공사비 소계<span class="amt">'+won(t.direct)+'</span></li>';
  html += '<li class="indent">일반관리비 (2.5%)<span class="amt">'+won(t.indGen)+'</span></li>';
  html += '<li class="indent">공과잡비 (1.0%)<span class="amt">'+won(t.indMisc)+'</span></li>';
  html += '<li class="strong">소계<span class="amt">'+won(t.subtotal)+'</span></li>';
  html += '<li>부가가치세 (10%)<span class="amt">'+won(t.vat)+'</span></li>';
  html += '</ul>';
  html += '<div class="total-card"><div class="label">주방 견적 총액</div><div class="value">₩ '+won(t.grand)+'</div><div class="vat-note">부가가치세 포함 금액입니다</div></div>';

  html += '<div class="breakdown"><div class="breakdown-title">항목별 내역</div>';
  t.items.forEach(it=>{
    html += '<div class="breakdown-row"><span>'+escapeHtml(it.label)+' <span class="mono" style="color:var(--ink-faint);">('+it.qty+(it.unit==='mm'?'mm':it.unit==='m'?'m':it.unit==='EA'?'EA':'')+')</span></span><span class="amt">'+won(it.amt)+'</span></div>';
  });
  html += '</div>';

  html += '<div class="action-row">'+
    '<button class="btn-secondary" id="btn-reset">기본값으로 초기화</button>'+
    '<button class="btn-primary" id="btn-print">견적서 출력</button>'+
  '</div>';
  html += '<div class="footnote">기본 단가는 참고용이며, 각 항목 옆의 단가 칸에서 직접 수정할 수 있습니다. 이 계산기는 독립 버전이며, 전체 인테리어 견적 계산기와는 아직 연동되어 있지 않습니다.</div>';

  $summary.innerHTML = html;
  document.getElementById('btn-reset').addEventListener('click', ()=>{
    if(confirm('모든 입력값과 단가 수정 내역을 초기화할까요?')) resetAll();
  });
  document.getElementById('btn-print').addEventListener('click', buildPrintView);
}
function renderSummaryOnly(){ renderSummary(computeTotals()); }

function resetAll(){
  state.segLens=[3600]; state.upperLenOverride=null; state.counterLenOverride=null; state.shape='i'; state.wall2Side='left';
  state.lowerDepthMM=600; state.upperDepthMM=320; state.counterDepthMM=600;
  state.islandLen=0; state.islandShape='i'; state.islandLeg2=1000; state.islandExtendMM=0;
  state.diagramView='plan'; state.frontWallIdx=0; state.sideRef='wall';
  state.doorTier='pet-matte'; state.counterMat='himacs';
  state.handleless=false; state.softClose=false; state.motorDrawerQty=0;
  state.sinkType='steel-under'; state.faucetType='basic'; state.cooktop='none';
  state.appliancesOn = {}; APPLIANCES.forEach(a=>{ state.appliancesOn[a.id]=a.defaultOn; });
  state.fridgeQty=0; state.tallQty=0; state.ledOn=false; state.outletQty=0; state.pantryQty=0;
  state.prices = {};
  render();
}

/* ============ Meta ============ */
function bindMeta(){
  document.querySelectorAll('[data-meta]').forEach(el=>{
    el.value = state.meta[el.dataset.meta] || '';
    el.addEventListener('input', e=>{ state.meta[e.target.dataset.meta] = e.target.value; });
  });
}

/* ============ Print ============ */
function buildPrintView(){
  const t = computeTotals();
  const today = new Date().toLocaleDateString('ko-KR');
  let rows = t.items.map(it=>'<tr><td>'+escapeHtml(it.label)+'</td><td class="p-right">'+it.qty+' '+it.unit+'</td><td class="p-right">'+won(it.unitPrice)+'</td><td class="p-right">'+won(it.amt)+'</td></tr>').join('');
  const html = ''+
    '<div class="p-title">주 방 견 적 서</div>'+
    '<div class="p-sub">DESIGN SANGSANG KITCHEN ESTIMATE</div>'+
    '<div class="p-meta">'+
      '<div><span>공급자</span> 디자인상상 (585-02-03690)</div>'+
      '<div><span>견적일</span> '+today+'</div>'+
      '<div><span>프로젝트/공사명</span> '+escapeHtml(state.meta.project||'-')+'</div>'+
      '<div><span>고객명</span> '+escapeHtml(state.meta.customer||'-')+' 귀하</div>'+
    '</div>'+
    '<table class="p-table"><thead><tr><th>항목</th><th class="p-right">수량</th><th class="p-right">단가</th><th class="p-right">금액</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<table class="p-totals"><tbody>'+
      '<tr><td>직접 공사비 소계</td><td class="p-right">'+won(t.direct)+' 원</td></tr>'+
      '<tr><td>간접공사비 (관리비+잡비)</td><td class="p-right">'+won(t.indirect)+' 원</td></tr>'+
      '<tr><td>소계</td><td class="p-right">'+won(t.subtotal)+' 원</td></tr>'+
      '<tr><td>부가가치세 (10%)</td><td class="p-right">'+won(t.vat)+' 원</td></tr>'+
      '<tr class="final"><td>총 계</td><td class="p-right">'+won(t.grand)+' 원</td></tr>'+
    '</tbody></table>'+
    '<div class="p-note">* 본 견적서는 V.A.T 포함 견적서이며, 발행일로부터 2주간 유효합니다.<br>* 상기 단가는 참고 기준이며 실측 및 자재 변경에 따라 조정될 수 있습니다.</div>';
  document.getElementById('printArea').innerHTML = html;
  window.print();
}

/* ============ Init ============ */
bindMeta();
render();

</script>
</body>
</html>
