<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디자인상상 · 인테리어 공사 견적 계산기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1E8;
  --surface:#FFFFFF;
  --surface-2:#FBF9F3;
  --ink:#221F19;
  --ink-dim:#6E6656;
  --ink-faint:#A79E8B;
  --line:#E2DBC8;
  --line-strong:#CFC5AA;
  --accent:#7B5A34;
  --accent-deep:#4E3A21;
  --accent-soft:#EFE4CE;
  --total-bg:#20301F;
  --total-bg-2:#2C4429;
  --total-ink:#F2EEDF;
  --danger:#9C3B2E;
  --option-tag:#3E5C6B;
  --radius:10px;
  --shadow:0 1px 2px rgba(34,31,25,.06), 0 6px 20px -8px rgba(34,31,25,.15);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num, .mono{
  font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}

/* ===== App shell ===== */
#app{display:flex; flex-direction:column; min-height:100vh;}

.topbar{
  background:var(--accent-deep);
  color:var(--total-ink);
  padding:18px 28px;
  display:flex;
  align-items:baseline;
  gap:14px;
  flex-wrap:wrap;
  border-bottom:3px solid var(--accent);
}
.topbar .brand-mark{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.14em;
  border:1px solid rgba(242,238,223,.4);
  padding:3px 7px;
  border-radius:4px;
  opacity:.85;
}
.topbar h1{
  font-size:19px;
  font-weight:800;
  margin:0;
  letter-spacing:-.01em;
}
.topbar .sub{
  font-size:12.5px;
  color:rgba(242,238,223,.68);
  margin-left:auto;
}
.mode-switch{
  display:flex;
  gap:4px;
  background:rgba(0,0,0,.18);
  padding:4px;
  border-radius:9px;
}
.mode-btn{
  border:none;
  background:transparent;
  color:rgba(242,238,223,.75);
  font-size:12.5px;
  font-weight:700;
  padding:7px 14px;
  border-radius:6px;
}
.mode-btn:hover{color:#fff;}
.mode-btn.active{background:var(--accent); color:#fff;}

/* ===== Admin (price & margin) table ===== */
.margin-box{
  background:var(--accent-soft);
  border:1px solid var(--line-strong);
  border-radius:var(--radius);
  padding:12px 14px;
  margin-bottom:14px;
}
.margin-box-label{font-size:12.5px; font-weight:700; color:var(--accent-deep); margin-bottom:8px;}
.margin-box-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.margin-cat-input{
  width:74px; padding:6px 8px; border:1.4px solid var(--accent); border-radius:6px;
  font-size:13.5px; font-weight:700; text-align:right; background:#fff;
}
.margin-box-hint{font-size:11px; color:var(--ink-dim); flex:1; min-width:180px;}
.btn-reset-group{flex:none; padding:7px 12px; font-size:11.5px;}

table.admin-table .col-cost{width:100px;}
table.admin-table .col-margin{width:96px; text-align:right;}
table.admin-table .col-final{width:110px; text-align:right; font-weight:700;}
.cost-input{
  width:88px; padding:5px 7px; border:1.3px solid var(--line-strong); border-radius:6px;
  text-align:right; font-size:12.5px; background:#fff;
}
.cost-input:focus{outline:none; border-color:var(--accent);}
.margin-input{width:52px;}
.na{color:var(--ink-faint);}
.final-price{color:var(--accent-deep); font-weight:800;}
.name-input{
  display:block; width:100%; border:none; border-bottom:1px solid var(--line);
  background:transparent; font-size:13px; font-weight:600; padding:3px 2px; margin-bottom:3px;
}
.spec-input{
  display:block; width:100%; border:none; background:transparent;
  font-size:11.5px; color:var(--ink-dim); padding:2px 2px;
}
.name-input:focus, .spec-input:focus{outline:none; background:var(--accent-soft); border-radius:4px;}
.unit-input{
  width:56px; border:1.3px solid var(--line-strong); border-radius:6px;
  padding:5px 6px; font-size:12px; text-align:center; background:#fff;
}

/* ===== Saved quotes view ===== */
.save-box{
  background:var(--surface-2);
  border:1px solid var(--line-strong);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:20px;
}
.save-box-title{font-size:13px; font-weight:700; color:var(--accent-deep); margin-bottom:10px;}
.save-box-row{display:flex; gap:8px;}
.save-box-row input{
  flex:1; padding:9px 12px; border:1.4px solid var(--line-strong); border-radius:8px; font-size:13.5px;
}
.save-box-hint{font-size:11.5px; color:var(--ink-dim); margin-top:10px;}
.saved-empty{
  text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:13px;
  border:1px dashed var(--line-strong); border-radius:var(--radius);
}
.saved-list{display:flex; flex-direction:column; gap:8px;}
.saved-item{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:13px 16px;
}
.saved-item-name{font-size:14px; font-weight:700; color:var(--ink);}
.saved-item-meta{font-size:11.5px; color:var(--ink-faint); margin-top:3px;}
.saved-item-actions{display:flex; gap:6px; align-items:center; flex:none;}
.btn-remove-snap{
  border:1.3px solid var(--danger); color:var(--danger); background:transparent;
  width:30px; height:30px; border-radius:7px; font-size:16px; line-height:1;
}
.btn-remove-snap:hover{background:rgba(156,59,46,.08);}

.meta-bar{
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:14px 28px;
  display:grid;
  grid-template-columns:repeat(4,minmax(150px,1fr));
  gap:14px 22px;
}
.meta-field label{
  display:block;
  font-size:10.5px;
  letter-spacing:.06em;
  color:var(--ink-faint);
  text-transform:uppercase;
  margin-bottom:4px;
  font-weight:600;
}
.meta-field input{
  width:100%;
  border:none;
  border-bottom:1.5px solid var(--line-strong);
  background:transparent;
  padding:3px 2px 6px;
  font-size:14.5px;
  color:var(--ink);
  font-weight:600;
}
.meta-field input:focus{outline:none;border-bottom-color:var(--accent);}

.layout{
  flex:1;
  display:grid;
  grid-template-columns:236px 1fr 328px;
  gap:0;
  align-items:start;
}

/* ===== Left nav ===== */
.nav{
  position:sticky; top:0;
  align-self:start;
  padding:18px 12px 40px;
  border-right:1px solid var(--line);
  background:var(--surface-2);
  height:100vh;
  overflow-y:auto;
}
.nav-title{
  font-size:10.5px;
  letter-spacing:.1em;
  color:var(--ink-faint);
  text-transform:uppercase;
  font-weight:700;
  padding:4px 10px 10px;
}
.nav-item{
  display:flex;
  align-items:center;
  gap:9px;
  width:100%;
  text-align:left;
  padding:9px 10px;
  border-radius:8px;
  border:none;
  background:transparent;
  color:var(--ink-dim);
  font-size:13px;
  font-weight:600;
  margin-bottom:2px;
  transition:background .12s;
}
.nav-item:hover{background:var(--accent-soft);}
.nav-item.active{background:var(--accent); color:#fff;}
.nav-item .idx{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  width:26px; height:20px;
  display:flex; align-items:center; justify-content:center;
  border-radius:5px;
  background:rgba(123,90,52,.12);
  color:var(--accent-deep);
  flex:none;
  font-weight:700;
}
.nav-item.active .idx{background:rgba(255,255,255,.22); color:#fff;}
.nav-item .cnt{
  margin-left:auto;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--ink-faint);
}
.nav-item.active .cnt{color:rgba(255,255,255,.85);}

/* ===== Main panel ===== */
.main{
  padding:26px 30px 80px;
  min-width:0;
}
.cat-head{
  margin-bottom:18px;
  padding-bottom:14px;
  border-bottom:2px solid var(--ink);
}
.cat-head .eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.1em;
  color:var(--accent);
  font-weight:700;
}
.cat-head h2{
  font-size:23px;
  margin:2px 0 0;
  font-weight:800;
  letter-spacing:-.01em;
}
.subgroup-title{
  font-size:13px;
  font-weight:700;
  color:var(--accent-deep);
  margin:22px 0 8px;
  padding-left:2px;
  border-left:3px solid var(--accent);
  padding-left:9px;
}
.subgroup-title:first-of-type{margin-top:0;}

table.items{
  width:100%;
  border-collapse:collapse;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:8px;
}
table.items thead th{
  background:var(--surface-2);
  text-align:left;
  font-size:11px;
  font-weight:700;
  color:var(--ink-faint);
  text-transform:uppercase;
  letter-spacing:.04em;
  padding:9px 10px;
  border-bottom:1px solid var(--line);
}
table.items td{
  padding:8px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
table.items tbody tr:last-child td{border-bottom:none;}
table.items tbody tr:hover{background:#FCFAF4;}
table.items tbody tr.has-qty{background:#FBF6E9;}
table.items tbody tr.has-qty:hover{background:#F8F0DC;}
.col-idx{width:34px; color:var(--ink-faint); font-size:11.5px;}
.col-name{min-width:190px;}
.item-name{font-weight:600; font-size:13.5px;}
.item-spec{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}
.col-unit{width:44px; color:var(--ink-dim); font-size:12.5px; text-align:center;}
.col-price{width:96px; text-align:right; font-size:12.5px; color:var(--ink-dim);}
.col-opt{width:56px; text-align:center;}
.col-qty{width:96px;}
.col-amt{width:112px; text-align:right; font-weight:700; font-size:13px;}

.qty-input{
  width:78px;
  padding:5px 7px;
  border:1.3px solid var(--line-strong);
  border-radius:6px;
  text-align:right;
  font-size:13px;
  background:#fff;
}
.qty-input:focus{outline:none; border-color:var(--accent);}
.opt-check{width:16px; height:16px; accent-color:var(--option-tag); cursor:pointer;}

.cat-subtotal{
  display:flex;
  justify-content:flex-end;
  gap:22px;
  padding:10px 4px 26px;
  font-size:12.5px;
  color:var(--ink-dim);
}
.cat-subtotal b{color:var(--ink); font-family:'JetBrains Mono',monospace;}

/* custom item row */
.custom-add{
  margin-top:8px;
  padding:12px;
  background:var(--surface-2);
  border:1px dashed var(--line-strong);
  border-radius:var(--radius);
}
.custom-add-title{font-size:11.5px; font-weight:700; color:var(--ink-faint); margin-bottom:8px; text-transform:uppercase; letter-spacing:.04em;}
.custom-add-grid{display:grid; grid-template-columns:1.6fr .9fr .8fr .9fr auto; gap:8px; align-items:center;}
.custom-add-grid input{
  padding:7px 9px;
  border:1.3px solid var(--line-strong);
  border-radius:6px;
  font-size:12.5px;
  width:100%;
}
.btn-add{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:8px 14px;
  border-radius:6px;
  font-size:12.5px;
  font-weight:700;
  white-space:nowrap;
}
.btn-add:hover{background:var(--accent-deep);}
.custom-row td{background:#FEFCF6;}
.btn-remove{
  border:none; background:transparent; color:var(--danger);
  font-size:16px; line-height:1; padding:2px 6px; border-radius:4px;
}
.btn-remove:hover{background:rgba(156,59,46,.1);}

/* ===== Summary panel ===== */
.summary{
  position:sticky; top:0;
  height:100vh;
  overflow-y:auto;
  border-left:1px solid var(--line);
  background:var(--surface);
  padding:22px 20px 30px;
}
.summary-title{
  font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-faint); font-weight:700; margin-bottom:14px;
}
.summary-list{list-style:none; margin:0 0 14px; padding:0;}
.summary-list li{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:7px 0; font-size:12.5px; color:var(--ink-dim);
  border-bottom:1px dashed var(--line);
}
.summary-list li .amt{font-family:'JetBrains Mono',monospace; color:var(--ink); font-weight:600;}
.summary-list li.indent{padding-left:10px; font-size:12px; color:var(--ink-faint);}
.summary-list li.strong{font-weight:700; color:var(--ink);}
.summary-list li.strong .amt{font-size:13.5px;}

.total-card{
  margin-top:16px;
  background:linear-gradient(155deg,var(--total-bg),var(--total-bg-2));
  color:var(--total-ink);
  border-radius:12px;
  padding:18px 18px 20px;
}
.total-card .label{
  font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  opacity:.72; font-weight:700; margin-bottom:6px;
}
.total-card .value{
  font-family:'JetBrains Mono',monospace;
  font-size:27px;
  font-weight:800;
  letter-spacing:-.01em;
}
.total-card .vat-note{font-size:11px; opacity:.6; margin-top:6px;}

.by-cat{margin-top:18px;}
.by-cat-title{font-size:11px; color:var(--ink-faint); font-weight:700; margin-bottom:8px; text-transform:uppercase; letter-spacing:.06em;}
.by-cat-row{
  display:flex; justify-content:space-between; font-size:11.5px;
  padding:5px 0; color:var(--ink-dim); cursor:pointer;
}
.by-cat-row:hover{color:var(--accent-deep);}
.by-cat-row .amt{font-family:'JetBrains Mono',monospace;}
.by-cat-row.zero{opacity:.4;}

.action-row{display:flex; gap:8px; margin-top:18px;}
.btn-secondary{
  flex:1;
  background:var(--surface-2);
  border:1.3px solid var(--line-strong);
  color:var(--ink);
  padding:10px 8px;
  border-radius:8px;
  font-size:12.5px;
  font-weight:700;
}
.btn-secondary:hover{background:var(--accent-soft); border-color:var(--accent);}
.btn-primary{
  flex:1;
  background:var(--ink);
  color:#fff;
  border:none;
  padding:10px 8px;
  border-radius:8px;
  font-size:12.5px;
  font-weight:700;
}
.btn-primary:hover{background:var(--accent-deep);}

.footnote{
  margin-top:16px;
  font-size:10.8px;
  color:var(--ink-faint);
  line-height:1.55;
  border-top:1px solid var(--line);
  padding-top:12px;
}

/* ===== Print view ===== */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:24px; font-size:12px;}
  .p-title{font-size:20px; font-weight:800; text-align:center; letter-spacing:.3em; margin-bottom:4px;}
  .p-sub{text-align:center; font-size:10px; color:#666; margin-bottom:18px;}
  .p-meta{display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; font-size:11px; margin-bottom:16px; border:1px solid #999; padding:10px 14px; border-radius:6px;}
  .p-meta div span{color:#666;}
  table.p-table{width:100%; border-collapse:collapse; margin-bottom:4px;}
  table.p-table th, table.p-table td{border:1px solid #ccc; padding:5px 7px; font-size:11px;}
  table.p-table th{background:#eee;}
  .p-cat-row td{background:#f7f5ee; font-weight:700;}
  .p-right{text-align:right;}
  .p-totals{width:320px; margin-left:auto; margin-top:12px; border-collapse:collapse;}
  .p-totals td{padding:5px 8px; font-size:11.5px; border-bottom:1px solid #ddd;}
  .p-totals tr.final td{font-weight:800; font-size:14px; border-top:2px solid #222; border-bottom:none;}
  .p-note{margin-top:18px; font-size:10px; color:#777; line-height:1.6;}
}

/* ===== Responsive ===== */
@media (max-width:1180px){
  .layout{grid-template-columns:200px 1fr;}
  .summary{position:static; height:auto; border-left:none; border-top:1px solid var(--line);}
}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;}
  .nav{position:static; height:auto; border-right:none; border-bottom:1px solid var(--line);}
  .nav-list{display:flex; flex-wrap:wrap; gap:6px;}
  .nav-item{width:auto;}
  .meta-bar{grid-template-columns:1fr 1fr;}
  .custom-add-grid{grid-template-columns:1fr 1fr;}
}

/* ===== 항목 선택(체크리스트) 화면 ===== */
.picker-wrap{max-width:640px; margin:40px auto; text-align:center;}
.picker-title{font-size:20px; font-weight:800; margin-bottom:26px;}
.picker-cards{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.picker-card{
  background:var(--surface); border:1.5px solid var(--line-strong); border-radius:14px;
  padding:26px 20px; text-align:left; cursor:pointer; transition:.15s;
}
.picker-card:hover{border-color:var(--accent); background:var(--accent-soft);}
.picker-ico{font-size:28px; margin-bottom:10px;}
.picker-name{font-size:15px; font-weight:800; margin-bottom:8px;}
.picker-desc{font-size:12.5px; color:var(--ink-dim); line-height:1.55;}

.select-wrap{padding-bottom:90px;}
.select-head{margin-bottom:18px;}
.select-head h2{font-size:17px; font-weight:800; margin:4px 0 4px;}
.select-desc{font-size:12px; color:var(--ink-dim);}
.select-progress{font-size:11px; color:var(--accent-deep); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.select-cat-block{margin-bottom:26px;}
.select-cat-title{font-size:12.5px; font-weight:800; color:var(--ink); background:var(--surface-2); padding:8px 12px; border-radius:8px; margin-bottom:8px;}
.check-list{display:flex; flex-direction:column; gap:2px;}
.check-row{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:7px; cursor:pointer; font-size:13px;
}
.check-row:hover{background:var(--surface-2);}
.check-row.checked{background:var(--accent-soft);}
.check-row input{width:16px; height:16px; flex:none; accent-color:var(--accent);}
.check-name{flex:1; display:flex; flex-direction:column;}
.check-spec{font-size:11px; color:var(--ink-faint); font-weight:400;}
.check-unit{font-size:11px; color:var(--ink-faint); flex:none;}
.select-footer{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:var(--surface); border-top:1.3px solid var(--line-strong);
  padding:14px 24px; display:flex; align-items:center; justify-content:flex-end; gap:14px;
  box-shadow:0 -4px 16px rgba(0,0,0,.06);
}
.select-count{margin-right:auto; font-size:12.5px; font-weight:700; color:var(--ink-dim);}
.nav-placeholder{padding:20px 14px; font-size:11.5px; color:var(--ink-faint); line-height:1.6; text-align:center;}
.empty-note{font-size:12.5px; color:var(--ink-faint); background:var(--surface-2); padding:14px 16px; border-radius:8px;}
.consult-actions{display:flex; align-items:center; gap:12px; margin-top:22px; padding-top:18px; border-top:1px solid var(--line);}
.consult-done-note{font-size:12px; color:var(--ink-faint);}

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <span class="brand-mark">DESIGN SANGSANG</span>
    <h1>인테리어 공사 견적 계산기</h1>
    <div class="mode-switch">
      <button class="mode-btn" data-mode-btn="quote">견적 작성</button>
      <button class="mode-btn" data-mode-btn="admin">단가 설정</button>
      <button class="mode-btn" data-mode-btn="saved">저장된 견적</button>
    </div>
    <span class="sub">디자인상상 · 실내 인테리어 공사 견적서 v2608</span>
  </header>

  <div class="meta-bar">

/* ============ State ============ */
const state = {
  mode: "quote",     // "quote" | "admin"

  qty: {},           // key `${group}|${i}` -> {q:Number, opt:Boolean}
  custom: {},        // key group -> [{id,n,u,p,q,opt}]

  marginOverride: {},// key group -> number (0~1), category-level margin override
  meta: { project:"", customer:"", date: new Date().toISOString().slice(0,10) },

};
let customSeq = 1;

/* ============ Math helpers ============ */
function roundUp(value, digits){
  if(!value) return 0;
  const factor = Math.pow(10, -digits);
  const scaled = value / factor;
  return Math.ceil(scaled - 1e-9) * factor;
}
function won(n){
  n = Math.round(n||0);
  return n.toLocaleString('ko-KR');
}
function lineAmt(price, q){ return (price||0) * (q||0); }
function pct(m){ return (Math.round(m*1000)/10); } // 0.25 -> 25 (for % input display, 1 decimal precision)

/* ============ Pricing engine ============ */
function effItem(group, i){
  const orig = CATALOG[group].items[i];
  const ov = state.priceOverride[group+"|"+i] || {};
  return {
    n: ov.n !== undefined ? ov.n : orig.n,
    s: ov.s !== undefined ? ov.s : orig.s,
    u: ov.u !== undefined ? ov.u : orig.u,
    mat: ov.mat !== undefined ? ov.mat : orig.mat,
    mp: orig.mp || -2,
    labor: ov.labor !== undefined ? ov.labor : orig.labor,
    lp: orig.lp || -3,
    exp: ov.exp !== undefined ? ov.exp : orig.exp,
    ep: orig.ep || -3,
    mo: ov.mo !== undefined ? ov.mo : orig.mo,
  };
}
function categoryMargin(group){
  return state.marginOverride[group] !== undefined ? state.marginOverride[group] : CATALOG[group].margin;
}
function computePrice(group, i){
  const it = effItem(group, i);
  const m = (it.mo !== undefined && it.mo !== null) ? it.mo : categoryMargin(group);
  let total = 0;
  if(it.mat !== undefined && it.mat !== null) total += roundUp(it.mat * (1+m), it.mp);
  if(it.labor !== undefined && it.labor !== null) total += roundUp(it.labor * (1+m), it.lp);
  if(it.exp !== undefined && it.exp !== null) total += roundUp(it.exp * (1+m), it.ep);
  return Math.round(total);
}
function setPriceField(group, i, field, value){
  const k = group+"|"+i;
  const cur = state.priceOverride[k] || {};
  state.priceOverride[k] = Object.assign({}, cur, {[field]: value});
}
function resetGroupPricing(group){
  Object.keys(state.priceOverride).forEach(k=>{
    if(k.startsWith(group+"|")) delete state.priceOverride[k];
  });
  delete state.marginOverride[group];
}
function resetAllPricing(){
  state.priceOverride = {};
  state.marginOverride = {};
}

/* ============ Quantity / custom item state ============ */
function itemKey(group, i){ return group+"|"+i; }
function isItemSelected(group, i){ return !!state.selected[itemKey(group,i)]; }
function toggleItemSelected(group, i){
  const k = itemKey(group,i);
  const next = !state.selected[k];
  if(next){ state.selected[k] = true; }
  else{ delete state.selected[k]; setQty(group, i, {q:0, opt:false}); }
}
function selectedCountAll(){ return Object.keys(state.selected).length; }
function backfillSelectedFromQty(){
  Object.keys(state.qty).forEach(k=>{
    if(state.qty[k] && state.qty[k].q > 0) state.selected[k] = true;
  });
}
function groupsForCat(cid){
  return cid==="5" ? [["5a",CATALOG["5a"].label],["5b",CATALOG["5b"].label]] : [[CAT_GROUPS[cid][0], null]];
}
function catItemList(group){
  const list = [];
  CATALOG[group].items.forEach((it,i)=>{ if(effItem(group,i).n) list.push(i); });
  return list;
}
function getQty(group, i){
  const k = group+"|"+i;
  return state.qty[k] || {q:0, opt:false};
}
function setQty(group, i, patch){
  const k = group+"|"+i;
  const cur = state.qty[k] || {q:0, opt:false};
  state.qty[k] = Object.assign({}, cur, patch);
}
function getCustomList(group){
  return state.custom[group] || [];
}
function addCustom(group, n, u, p, opt){
  if(!n || !p) return;
  const list = getCustomList(group).slice();
  list.push({id:"c"+(customSeq++), n:n, u:u||'식', p:Number(p)||0, q:1, opt:!!opt});
  state.custom[group] = list;
  renderAll();
}
function updateCustom(group, id, patch){
  state.custom[group] = getCustomList(group).map(it => it.id===id ? Object.assign({}, it, patch) : it);
}
function removeCustom(group, id){
  state.custom[group] = getCustomList(group).filter(it=>it.id!==id);
  renderAll();
}
function groupSum(group){
  let sum = 0;
  CATALOG[group].items.forEach((it,i)=>{
    const st = getQty(group,i);
    if(st.q>0) sum += lineAmt(computePrice(group,i), st.q);
  });
  getCustomList(group).forEach(it=>{
    if(it.q>0) sum += lineAmt(it.p, it.q);
  });
  return sum;
}

/* ============ Totals ============ */
function computeTotals(){
  let basicDirect = 0, optionDirect = 0;
  const byCat = {};
  CAT_ORDER.forEach(cid=>{
    let sum = 0;
    CAT_GROUPS[cid].forEach(group=>{
      sum += groupSum(group);
      CATALOG[group].items.forEach((it,i)=>{
        const st = getQty(group, i);
        if(st.q>0){
          const amt = lineAmt(computePrice(group,i), st.q);
          if(st.opt) optionDirect += amt; else basicDirect += amt;
        }
      });
      getCustomList(group).forEach(it=>{
        if(it.q>0){
          const amt = lineAmt(it.p, it.q);
          if(it.opt) optionDirect += amt; else basicDirect += amt;
        }
      });
    });
    byCat[cid] = sum;
  });
  const directTotal = basicDirect + optionDirect;
  const indGen = directTotal * IND_GEN;
  const indMisc = directTotal * IND_MISC;
  const indirectTotal = indGen + indMisc;
  const subtotal = directTotal + indirectTotal;
  const vat = subtotal * VAT;
  const grand = subtotal + vat;
  return {basicDirect, optionDirect, directTotal, indGen, indMisc, indirectTotal, subtotal, vat, grand, byCat};
}

/* ============ Persistence (localStorage) ============ */
const STORAGE_DRAFT = 'ds_estimate_draft_v1';
const STORAGE_SAVED  = 'ds_estimate_saved_v1';
function saveDraft(){
  try{
    localStorage.setItem(STORAGE_DRAFT, JSON.stringify({
      qty: state.qty, custom: state.custom,
      priceOverride: state.priceOverride, marginOverride: state.marginOverride,
      meta: state.meta, selected: state.selected, phase: state.phase, flow: state.flow, selectIdx: state.selectIdx, catView: state.catView,
    }));
  }catch(e){ /* storage unavailable (e.g. private mode) -- fail silently */ }
}
function loadDraft(){
  try{
    const raw = localStorage.getItem(STORAGE_DRAFT);
    if(!raw) return;
    const obj = JSON.parse(raw);
    state.qty = obj.qty || {};
    state.custom = obj.custom || {};
    state.priceOverride = obj.priceOverride || {};
    state.marginOverride = obj.marginOverride || {};
    state.meta = Object.assign(state.meta, obj.meta || {});
    state.selected = obj.selected || {};
    state.phase = obj.phase || (Object.keys(state.qty).length ? 'build' : 'picker');
    state.flow = obj.flow || null;
    state.selectIdx = obj.selectIdx || 0;
    state.catView = obj.catView || {};
    if(state.phase === 'build' && selectedCountAll()===0) backfillSelectedFromQty();
  }catch(e){ /* ignore corrupt draft */ }
}
function loadSavedList(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_SAVED) || '[]'); }
  catch(e){ return []; }
}
function writeSavedList(list){
  try{ localStorage.setItem(STORAGE_SAVED, JSON.stringify(list)); }
  catch(e){ alert('브라우저 저장 공간이 부족하거나 사용할 수 없습니다.'); }
}
function saveCurrentAsSnapshot(label){
  const t = computeTotals();
  const list = loadSavedList();
  const snap = {
    id: 's'+Date.now(),
    customer: label || state.meta.customer || '(이름 없음)',
    project: state.meta.project || '',
    savedAt: new Date().toISOString(),
    grandTotal: t.grand,
    data: {
      qty: state.qty, custom: state.custom,
      priceOverride: state.priceOverride, marginOverride: state.marginOverride,
      meta: state.meta, selected: state.selected,
    },
  };
  list.unshift(snap);
  writeSavedList(list);
}
function loadSnapshot(id){
  const snap = loadSavedList().find(s=>s.id===id);
  if(!snap) return;
  state.qty = snap.data.qty || {};
  state.custom = snap.data.custom || {};
  state.priceOverride = snap.data.priceOverride || {};
  state.marginOverride = snap.data.marginOverride || {};
  state.meta = Object.assign(state.meta, snap.data.meta || {});
  state.selected = snap.data.selected || {};
  if(selectedCountAll()===0) backfillSelectedFromQty();
  state.phase = 'build';
  state.flow = state.flow || 'solo';
  state.mode = 'quote';
  renderAll();
}
function deleteSnapshot(id){
  writeSavedList(loadSavedList().filter(s=>s.id!==id));
}

/* ============ Main render ============ */
function renderMain(){
  if(state.mode === 'saved'){ renderSavedView(); return; }
  if(state.mode === 'quote' && state.phase === 'picker'){
    $main.innerHTML = pickerHTML(); bindPickerEvents(); return;
  }
  if(state.mode === 'quote' && state.phase === 'select'){
    $main.innerHTML = selectSoloHTML();
    bindSelectEvents(); return;
  }
  if(state.mode === 'quote' && (state.flow === 'consult' || state.flow === 'solo')){
    renderConsultCategory(); return;
  }
  const cid = state.active;
  const meta = CAT_META[cid];
  let body = '<div class="cat-head"><div class="eyebrow">CATEGORY '+meta.no+' · '+(state.mode==='admin'?'단가 설정':'견적 작성')+'</div><h2>'+meta.title+'</h2>'+
    (state.mode==='quote' ? '<button class="btn-secondary" style="flex:none;padding:8px 14px;" data-role="back-to-select">+ 항목 추가하기</button>' : '')+
    '</div>';

  const groups = cid==="5" ? [["5a",CATALOG["5a"].label],["5b",CATALOG["5b"].label]] : [[CAT_GROUPS[cid][0], null]];

  groups.forEach(([group,label])=>{
    if(label) body += '<div class="subgroup-title">'+label+'</div>';
    body += state.mode === 'admin' ? adminTableHTML(group) : quoteTableHTML(group);
  });

  $main.innerHTML = body;
  bindMainEvents();
}

function bindMainEvents(){
  const backBtn = document.querySelector('[data-role="back-to-select"]');
  if(backBtn) backBtn.addEventListener('click', ()=>{
    state.phase = 'select';
    if(!state.flow) state.flow = 'solo';
    if(state.flow === 'consult') state.selectIdx = 0;
    saveDraft(); renderAll(); window.scrollTo(0,0);
  });
  if(state.mode === 'quote'){
    $main.querySelectorAll('[data-role="qty"]').forEach(el=>{
      el.addEventListener('input', e=>{
        const group = e.target.dataset.group, i = parseInt(e.target.dataset.i,10);
        const v = Math.max(0, parseInt(e.target.value||'0',10)||0);
        setQty(group, i, {q:v});
        updateRowAmount(e.target.closest('tr'), computePrice(group,i), v);
        updateSubtotalDisplay(group);
        renderNav(); renderSummary();
      });
    });
    $main.querySelectorAll('[data-role="opt"]').forEach(el=>{
      el.addEventListener('change', e=>{
        setQty(e.target.dataset.group, parseInt(e.target.dataset.i,10), {opt:e.target.checked});
        renderSummary();
      });
    });
    $main.querySelectorAll('[data-role="c-qty"]').forEach(el=>{
      el.addEventListener('input', e=>{
        const group = e.target.dataset.group, id = e.target.dataset.id;
        const v = Math.max(0, parseInt(e.target.value||'0',10)||0);
        updateCustom(group, id, {q:v});
        const it = getCustomList(group).find(x=>x.id===id);
        updateRowAmount(e.target.closest('tr'), it.p, v);
        updateSubtotalDisplay(group);
        renderNav(); renderSummary();
      });
    });
    $main.querySelectorAll('[data-role="c-opt"]').forEach(el=>{
      el.addEventListener('change', e=>{
        updateCustom(e.target.dataset.group, e.target.dataset.id, {opt:e.target.checked});
        renderSummary();
      });
    });
    $main.querySelectorAll('[data-role="c-del"]').forEach(el=>{
      el.addEventListener('click', e=>{ removeCustom(e.target.dataset.group, e.target.dataset.id); });
    });
    $main.querySelectorAll('[data-role="new-add"]').forEach(el=>{
      el.addEventListener('click', e=>{
        const group = e.target.dataset.group;
        const root = e.target.closest('.custom-add-grid');
        const n = root.querySelector('[data-role="new-n"]').value.trim();
        const u = root.querySelector('[data-role="new-u"]').value.trim();
        const p = root.querySelector('[data-role="new-p"]').value;
        const opt = root.querySelector('[data-role="new-opt"]').checked;
        if(!n || !p){ alert('품명과 단가를 입력해 주세요.'); return; }
        addCustom(group, n, u, p, opt);
      });
    });
  } else {
    // admin mode
    $main.querySelectorAll('[data-role="name-edit"]').forEach(el=>{
      el.addEventListener('input', e=>{
        setPriceField(e.target.dataset.group, parseInt(e.target.dataset.i,10), 'n', e.target.value);
        saveDraft();
      });
    });
    $main.querySelectorAll('[data-role="spec-edit"]').forEach(el=>{
      el.addEventListener('input', e=>{
        setPriceField(e.target.dataset.group, parseInt(e.target.dataset.i,10), 's', e.target.value);
        saveDraft();
      });
    });
    $main.querySelectorAll('[data-role="unit-edit"]').forEach(el=>{
      el.addEventListener('input', e=>{
        setPriceField(e.target.dataset.group, parseInt(e.target.dataset.i,10), 'u', e.target.value);
        saveDraft();
      });
    });
    $main.querySelectorAll('[data-role="cost"]').forEach(el=>{
      el.addEventListener('input', e=>{
        const group = e.target.dataset.group, i = parseInt(e.target.dataset.i,10), field = e.target.dataset.field;
        const v = e.target.value === '' ? 0 : Number(e.target.value);
        setPriceField(group, i, field, v);
        updateFinalPriceCell(e.target.closest('tr'), group, i);
        renderNav(); renderSummaryOnly();
      });
    });
    $main.querySelectorAll('[data-role="item-margin"]').forEach(el=>{
      el.addEventListener('input', e=>{
        const group = e.target.dataset.group, i = parseInt(e.target.dataset.i,10);
        const raw = e.target.value;
        const v = raw === '' ? undefined : Number(raw)/100;
        setPriceField(group, i, 'mo', v);
        updateFinalPriceCell(e.target.closest('tr'), group, i);
        renderNav(); renderSummaryOnly();
      });
    });
    $main.querySelectorAll('[data-role="cat-margin"]').forEach(el=>{
      el.addEventListener('input', e=>{
        const group = e.target.dataset.group;
        const v = e.target.value === '' ? CATALOG[group].margin : Number(e.target.value)/100;
        state.marginOverride[group] = v;
        refreshGroupFinalPrices(group);
        renderNav(); renderSummaryOnly();
      });
    });
    $main.querySelectorAll('[data-role="reset-group"]').forEach(el=>{
      el.addEventListener('click', e=>{
        const group = e.target.dataset.group;
        if(confirm('"'+CATALOG[group].label+'" 공종의 단가와 마진율을 원본 값으로 초기화할까요?')){
          resetGroupPricing(group);
          renderAll();
        }
      });
    });
  }
}
function updateRowAmount(tr, price, q){
  const span = tr.querySelector('.amt-text');
  if(span) span.textContent = q>0 ? won(lineAmt(price,q)) : '';
  tr.classList.toggle('has-qty', q>0);
}
function updateSubtotalDisplay(group){
  const el = document.getElementById('subtotal-'+group);
  if(el) el.innerHTML = '소계 <b>'+won(groupSum(group))+'</b> 원';
}
function updateFinalPriceCell(tr, group, i){
  const span = tr.querySelector('.final-price');
  if(span) span.textContent = won(computePrice(group,i));
}
function refreshGroupFinalPrices(group){
  $main.querySelectorAll('tr').forEach(tr=>{
    const span = tr.querySelector('.final-price');
    if(!span) return;
    const input = tr.querySelector('[data-role="cost"], [data-role="item-margin"]');
    if(!input) return;
    if(input.dataset.group !== group) return;
    const i = parseInt(input.dataset.i,10);
    span.textContent = won(computePrice(group,i));
  });
}

/* ============ Saved quotes view ============ */
function renderSavedView(){
  const list = loadSavedList();
  const t = computeTotals();
  let html = '<div class="cat-head"><div class="eyebrow">CUSTOMER ARCHIVE</div><h2>저장된 견적 관리</h2></div>';
  html += '<div class="save-box">'+
    '<div class="save-box-title">현재 작업 중인 견적을 이름 붙여 저장</div>'+
    '<div class="save-box-row">'+
      '<input type="text" id="save-name-input" placeholder="고객명 / 프로젝트명" value="'+escapeHtml(state.meta.customer||state.meta.project||'')+'">'+
      '<button class="btn-add" id="btn-save-snapshot">현재 견적 저장</button>'+
    '</div>'+
    '<div class="save-box-hint">현재 작업 중인 견적 총액: <b>₩ '+won(t.grand)+'</b> · 이 브라우저(이 컴퓨터)에만 저장되며, 새로고침해도 사라지지 않습니다.</div>'+
  '</div>';

  if(list.length===0){
    html += '<div class="saved-empty">아직 저장된 견적이 없습니다. 위에서 고객명을 입력하고 저장해 보세요.</div>';
  } else {
    html += '<div class="saved-list">';
    list.forEach(s=>{
      let dateStr = '';
      try{ dateStr = new Date(s.savedAt).toLocaleString('ko-KR'); }catch(e){}
      html += '<div class="saved-item">'+
        '<div class="saved-item-main">'+
          '<div class="saved-item-name">'+escapeHtml(s.customer)+(s.project? ' · '+escapeHtml(s.project):'')+'</div>'+
          '<div class="saved-item-meta">'+dateStr+' 저장 · 총 ₩ '+won(s.grandTotal||0)+'</div>'+
        '</div>'+
        '<div class="saved-item-actions">'+
          '<button class="btn-secondary" data-role="load-snap" data-id="'+s.id+'">불러오기</button>'+
          '<button class="btn-remove-snap" data-role="del-snap" data-id="'+s.id+'" title="삭제">×</button>'+
        '</div>'+
      '</div>';
    });
    html += '</div>';
  }
  html += '<div class="footnote">지금은 이 브라우저에만 저장되는 테스트 버전입니다. 실제 사무실에서 여러 명이 같은 저장 목록을 보려면 서버에 올려야 하는데, 준비되시면 무료로 호스팅하는 방법부터 순서대로 안내해 드릴게요.</div>';
  $main.innerHTML = html;

  document.getElementById('btn-save-snapshot').addEventListener('click', ()=>{
    const label = document.getElementById('save-name-input').value.trim();
    if(!label){ alert('고객명 또는 프로젝트명을 입력해 주세요.'); return; }
    saveCurrentAsSnapshot(label);
    renderMain();
  });
  $main.querySelectorAll('[data-role="load-snap"]').forEach(el=>{
    el.addEventListener('click', e=>{
      if(confirm('저장된 견적을 불러오면 현재 작업 중인 내용은 덮어씌워집니다. 계속할까요?')){
        loadSnapshot(e.target.dataset.id);
      }
    });
  });
  $main.querySelectorAll('[data-role="del-snap"]').forEach(el=>{
    el.addEventListener('click', e=>{
      if(confirm('이 저장된 견적을 삭제할까요?')){
        deleteSnapshot(e.target.dataset.id);
        renderMain();
      }
    });
  });
}

/* ============ Summary panel ============ */
function summaryHTML(){
  const t = computeTotals();
  let html = '<div class="summary-title">견적 요약</div>';
  html += '<ul class="summary-list">';
  html += '<li>기본 공사 직접비<span class="amt">'+won(t.basicDirect)+'</span></li>';
  html += '<li>옵션 공사 직접비<span class="amt">'+won(t.optionDirect)+'</span></li>';
  html += '<li class="strong">A. 직접공사비 소계<span class="amt">'+won(t.directTotal)+'</span></li>';
  html += '<li class="indent">일반관리비 (2.5%)<span class="amt">'+won(t.indGen)+'</span></li>';
  html += '<li class="indent">공과잡비 (1.0%)<span class="amt">'+won(t.indMisc)+'</span></li>';
  html += '<li class="strong">B. 간접공사비 소계<span class="amt">'+won(t.indirectTotal)+'</span></li>';
  html += '<li class="strong">소계 (A+B)<span class="amt">'+won(t.subtotal)+'</span></li>';
  html += '<li>부가가치세 (10%)<span class="amt">'+won(t.vat)+'</span></li>';
  html += '</ul>';
  html += '<div class="total-card"><div class="label">총 공사 견적 금액</div><div class="value">₩ '+won(t.grand)+'</div><div class="vat-note">부가가치세 포함 금액입니다</div></div>';
  html += '<div class="by-cat"><div class="by-cat-title">공종별 내역</div>';
  CAT_ORDER.forEach(cid=>{
    const meta = CAT_META[cid];
    const v = t.byCat[cid];
    html += '<div class="by-cat-row '+(v?'':'zero')+'" data-cat="'+cid+'"><span>'+meta.no+'. '+meta.title+'</span><span class="amt">'+won(v)+'</span></div>';
  });
  html += '</div>';
  html += '<div class="action-row">'+
    '<button class="btn-secondary" id="btn-reset">수량 초기화</button>'+
    '<button class="btn-primary" id="btn-print">견적서 출력</button>'+
  '</div>';
  html += '<div class="action-row">'+
    '<button class="btn-secondary" id="btn-reset-price" style="flex:1 1 100%;">단가·마진 전체 초기화</button>'+
  '</div>';
  html += '<div class="footnote">단가 탭에서 재료비·노무비·경비와 마진율을 주기적으로 조정할 수 있습니다. 창호 특수 사이즈, 맞춤 제작 품목 등은 "직접 입력"으로 추가해 주세요.</div>';
  return html;
}
function renderSummary(){
  saveDraft();
  $summary.innerHTML = summaryHTML();
  bindSummaryEvents();
}
function renderSummaryOnly(){ renderSummary(); }
function bindSummaryEvents(){
  $summary.querySelectorAll('.by-cat-row').forEach(el=>{
    el.addEventListener('click', ()=>{ state.active = el.dataset.cat; renderAll(); window.scrollTo(0,0); });
  });
  document.getElementById('btn-reset').addEventListener('click', ()=>{
    if(confirm('입력한 모든 수량과 선택 항목을 초기화하고 처음부터 다시 시작할까요? (단가·마진 설정은 유지됩니다)')){
      state.qty = {}; state.custom = {}; state.selected = {};
      state.phase = 'picker'; state.flow = null; state.selectIdx = 0; state.catView = {};
      saveDraft(); renderAll();
    }
  });
  document.getElementById('btn-reset-price').addEventListener('click', ()=>{
    if(confirm('모든 공종의 단가·마진율 수정 내역을 원본 값으로 초기화할까요?')){
      resetAllPricing(); renderAll();
    }
  });
  document.getElementById('btn-print').addEventListener('click', buildPrintView);
}

function renderAll(){
  $modeBtns.forEach(b=>b.classList.toggle('active', b.dataset.modeBtn===state.mode));
  renderNav();
  renderMain();
  renderSummary();
}

/* ============ Meta fields ============ */
function bindMeta(){
  document.querySelectorAll('[data-meta]').forEach(el=>{
    el.value = state.meta[el.dataset.meta] || '';
    el.addEventListener('input', e=>{ state.meta[e.target.dataset.meta] = e.target.value; saveDraft(); });
  });
}
function bindModeSwitch(){
  $modeBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.mode = btn.dataset.modeBtn;
      renderAll();
      window.scrollTo(0,0);
    });
  });
}

/* ============ Print view ============ */
function buildPrintView(){
  const t = computeTotals();
  const today = new Date().toLocaleDateString('ko-KR');
  let rows = '';
  CAT_ORDER.forEach(cid=>{
    const meta = CAT_META[cid];
    let catRows = '';
    CAT_GROUPS[cid].forEach(group=>{
      CATALOG[group].items.forEach((it,i)=>{
        const st = getQty(group,i);
        if(st.q>0){
          const price = computePrice(group,i);
          catRows += '<tr><td>'+escapeHtml(it.n)+(it.s?' <span style="color:#888">('+escapeHtml(it.s)+')</span>':'')+(st.opt?' <b style="color:#3E5C6B">[옵션]</b>':'')+'</td><td>'+escapeHtml(it.u)+'</td><td class="p-right">'+won(price)+'</td><td class="p-right">'+st.q+'</td><td class="p-right">'+won(lineAmt(price,st.q))+'</td></tr>';
        }
      });
      getCustomList(group).forEach(it=>{
        if(it.q>0){
          catRows += '<tr><td>'+escapeHtml(it.n)+(it.opt?' <b style="color:#3E5C6B">[옵션]</b>':'')+'</td><td>'+escapeHtml(it.u)+'</td><td class="p-right">'+won(it.p)+'</td><td class="p-right">'+it.q+'</td><td class="p-right">'+won(lineAmt(it.p,it.q))+'</td></tr>';
        }
      });
    });
    if(catRows){
      rows += '<tr class="p-cat-row"><td colspan="5">'+meta.no+'. '+meta.title+'</td></tr>' + catRows;
    }
  });
  if(!rows){
    rows = '<tr><td colspan="5" style="text-align:center;color:#999;">선택된 항목이 없습니다.</td></tr>';
  }
  const html = ''+
    '<div class="p-title">견 적 서</div>'+
    '<div class="p-sub">DESIGN SANGSANG INTERIOR ESTIMATE</div>'+
    '<div class="p-meta">'+
      '<div><span>공급자</span> 디자인상상 (585-02-03690)</div>'+
      '<div><span>견적일</span> '+today+'</div>'+
      '<div><span>프로젝트/공사명</span> '+escapeHtml(state.meta.project||'-')+'</div>'+
      '<div><span>고객명</span> '+escapeHtml(state.meta.customer||'-')+' 귀하</div>'+
      '<div><span>전시장 주소</span> 서울 강동구 고덕로 133, 롯데캐슬퍼스트상가 209호 (암사동)</div>'+
      '<div><span>담당자</span> 윤상돈 실장</div>'+
    '</div>'+
    '<table class="p-table"><thead><tr><th>품명 / 규격</th><th>단위</th><th class="p-right">단가</th><th class="p-right">수량</th><th class="p-right">금액</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<table class="p-totals"><tbody>'+
      '<tr><td>A. 직접공사비 소계</td><td class="p-right">'+won(t.directTotal)+' 원</td></tr>'+
      '<tr><td>B. 간접공사비 소계 (관리비+잡비)</td><td class="p-right">'+won(t.indirectTotal)+' 원</td></tr>'+
      '<tr><td>소계</td><td class="p-right">'+won(t.subtotal)+' 원</td></tr>'+
      '<tr><td>부가가치세 (10%)</td><td class="p-right">'+won(t.vat)+' 원</td></tr>'+
      '<tr class="final"><td>총 계</td><td class="p-right">'+won(t.grand)+' 원</td></tr>'+
    '</tbody></table>'+
    '<div class="p-note">* 본 견적서는 V.A.T 포함 견적서이며, 발행일로부터 2주간 유효합니다.<br>* 상기 기재된 내용은 참고 단가 기준의 가견적이며, 현장 실측 및 자재·시공 방법 변경에 따라 조정될 수 있습니다.<br>* 입금계좌 : IBK기업은행 119-248205-04-016 (예금주 : 이윤정)</div>';
  document.getElementById('printArea').innerHTML = html;
  window.print();
}

/* ============ Init ============ */
loadDraft();
bindMeta();
bindModeSwitch();
renderAll();

</script>
</body>
</html>
