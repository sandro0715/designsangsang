async function loadCurrentRoleAndApply(){
  try{
    const { data: { user } } = await sb.auth.getUser();
    if(!user) return;
    const { data } = await sb.from('profiles').select('role').eq('id', user.id).single();
    CURRENT_ROLE = data ? data.role : null;
  }catch(e){ CURRENT_ROLE = null; }
  if(EMBED_ADMIN_MODE){
    if(CURRENT_ROLE === 'admin'){
      state.mode = 'admin';
    } else {
      $main.innerHTML = '<div class="empty-note" style="margin:30px;">관리자만 접근할 수 있는 화면이에요.</div>';
      return;
    }
  }
  renderAll();
}

/* ============ Print view ============ */
function buildPrintView(){

          const it = effItemQ(group,i);
          const parts = rowPriceParts(group,i);
          const price = parts.mat+parts.labor+parts.exp;
          const amt = lineAmt(price,st.q);
          const rowHtml = '<tr><td>'+escapeHtml(it.n)+(it.s?' <span style="color:#888">('+escapeHtml(it.s)+')</span>':'')+(it.note?' <span style="color:#B5842C">['+escapeHtml(it.note)+']</span>':'')+'</td><td class="p-center">'+escapeHtml(it.u)+'</td><td class="p-center">'+st.q+'</td>'+
            '<td class="p-right">'+(parts.mat>0?won(parts.mat):'-')+'</td><td class="p-right">'+(parts.labor>0?won(parts.labor):'-')+'</td><td class="p-right">'+(parts.exp>0?won(parts.exp):'-')+'</td>'+
            '<td class="p-right">'+won(amt)+'</td></tr>';
          if(st.opt) optionRows += '<tr><td>'+meta.no+'. '+meta.title+' — '+escapeHtml(it.n)+(it.s?' ('+escapeHtml(it.s)+')':'')+'</td><td class="p-center">'+escapeHtml(it.u)+'</td><td class="p-center">'+st.q+'</td><td class="p-right">'+won(amt)+'</td></tr>';
          else { catRows += rowHtml; catSum += amt; }
        }
      });
      getCustomList(group).forEach(it=>{
        if(it.q>0){
          const effPrice = customEffectivePrice(group, it);
          const amt = lineAmt(effPrice,it.q);
          const rowHtml = '<tr><td>'+escapeHtml(it.n)+(it.s?' <span style="color:#888">('+escapeHtml(it.s)+')</span>':'')+(it.note?' <span style="color:#B5842C">['+escapeHtml(it.note)+']</span>':'')+'</td><td class="p-center">'+escapeHtml(it.u)+'</td><td class="p-center">'+it.q+'</td>'+
            '<td class="p-right">'+won(effPrice)+'</td><td class="p-right">-</td><td class="p-right">-</td>'+
            '<td class="p-right">'+won(amt)+'</td></tr>';
          if(it.opt) optionRows += '<tr><td>'+meta.no+'. '+meta.title+' — '+escapeHtml(it.n)+(it.s?' ('+escapeHtml(it.s)+')':'')+'</td><td class="p-center">'+escapeHtml(it.u)+'</td><td class="p-center">'+it.q+'</td><td class="p-right">'+won(amt)+'</td></tr>';
          else { catRows += rowHtml; catSum += amt; }
        }
      });
      if(isCarpenterDirectGroup(group)){
        const days = carpenterEffectiveDays(group);
        if(days>0){
          const wage = tradeDayWage(group);
          const laborAmt = days*wage;
          catRows += '<tr><td>'+tradeLabel(group)+' 인건비 (품수)</td><td class="p-center">품</td><td class="p-center">'+days+'</td>'+
            '<td class="p-right">-</td><td class="p-right">'+won(wage)+'</td><td class="p-right">-</td>'+
            '<td class="p-right">'+won(laborAmt)+'</td></tr>';
          catSum += laborAmt;
        }
      }
    });
    if(catRows){
      if(!isFirstCat) rows += '<tr class="p-spacer-row"><td colspan="7">&nbsp;</td></tr>';
      isFirstCat = false;
      rows += '<tr class="p-cat-row"><td colspan="6">'+meta.no+'. '+meta.title+'</td><td class="p-right">'+won(catSum)+'</td></tr>' + catRows;
    }
  });
  if(!rows){
    rows = '<tr><td colspan="7" style="text-align:center;color:#999;">선택된 항목이 없습니다.</td></tr>';
  }
  const autoTitle = autoProjectTitleFromAddress(state.customerAddressCache);
  const projectTitle = state.meta.project || autoTitle || '-';
  const totalsTableHTML = ''+
    '<table class="p-totals"><tbody>'+
      '<tr><td>'+(t.isDirect?'A. 실행원가 소계 (마진 0%)':'A. 직접공사비 소계')+'</td><td class="p-right">'+won(t.directTotal)+' 원</td></tr>'+
      (t.isDirect ? '' : t.indirectItems.filter(it=>it.checked).map(it=>'<tr><td class="p-indent">'+escapeHtml(it.label)+' ('+(Number(it.percent)||0)+'%)</td><td class="p-right">'+won(it.amt)+' 원</td></tr>').join(''))+
      '<tr><td>'+(t.isDirect?'B. 수수료+공정관리비 소계':'B. 간접공사비 소계')+'</td><td class="p-right">'+won(t.indirectTotal)+' 원</td></tr>'+

  const page1 = ''+
    '<div class="p-page p-page1">'+
      '<div class="p-header">'+

/* 금액 입력칸(.money-input)은 타이핑하는 동안 자동으로 콤마(천단위)가 붙어요 */
document.addEventListener('input', e=>{
  if(!e.target.classList || !e.target.classList.contains('money-input')) return;
  const el = e.target;
  const cursorAtEnd = el.selectionStart === el.value.length;
  const digits = el.value.replace(/[^\d]/g,'');
  el.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
  if(cursorAtEnd) el.setSelectionRange(el.value.length, el.value.length);
});

/* ============ Init ============ */
(async function initFromURL(){
  const params = new URLSearchParams(window.location.search);
  const customerId = params.get('customer_id');
  const customerName = params.get('customer_name');
  const projectName = params.get('project_name');
  const quoteId = params.get('quote_id');
  EMBED_ADMIN_MODE = params.get('mode') === 'admin';
  const activeParam = params.get('active');
  if(EMBED_ADMIN_MODE && activeParam){
    state.mode = 'admin';
    state.active = activeParam; // 'config' | 'products' | 카테고리 번호
    FOCUSED_ADMIN_SECTION = true;
  }

  bindMeta();
  bindModeSwitch();
  if(EMBED_ADMIN_MODE){
    const topbar = document.getElementById('app-topbar');
    if(topbar) topbar.style.display = 'none';
    const metaBar = document.querySelector('.meta-bar');
    if(metaBar) metaBar.style.display = 'none';
    const toolbar = document.getElementById('quote-toolbar');
    if(toolbar) toolbar.style.display = 'none';
    const summary = document.getElementById('summary-content');
    if(summary) summary.style.display = 'none';
    const sumToggle = document.getElementById('summary-toggle');
    if(sumToggle) sumToggle.style.display = 'none';
    document.body.classList.add('embed-admin');
  }

  $main.innerHTML = '<div class="loading-note">불러오는 중…</div>';
  const catalogOk = await loadCatalogFromServer(); // 기본 단가표: 로그인+승인된 사용자만 서버에서 조회 가능
  if(!catalogOk){
    $main.innerHTML = '<div class="empty-note" style="margin:30px;">기본 단가표를 불러오지 못했어요. 로그인이 되어 있는지 확인하거나 새로고침해 주세요.</div>';
    return;
  }
  await loadLivePricing(); // 항상 최신 단가·마진을 서버에서 먼저 불러옴

  if(EMBED_ADMIN_MODE){
    // index.html "설정" 탭에서 열린 경우: 관리자 확인 후 설정 화면만 보여줌 (내부에서 renderAll 처리)
    await loadCurrentRoleAndApply();
    return;
  }
  loadCurrentRoleAndApply(); // 일반 화면에서는 백그라운드로 등급만 확인 (지금은 UI에 영향 없음)

  if(quoteId){
    // 특정 저장된 견적을 직접 불러오는 경우 (그 견적 저장 당시의 단가로 덮어씀 - 아래 loadSnapshot에서 처리)
    state.customerId = customerId || null;
    state.customerName = customerName ? decodeURIComponent(customerName) : null;
    await loadSnapshot(quoteId); // 내부에서 renderAll() 호출함
    await loadCustomerAddressCache();
  } else if(customerId){
    // 고객 상세 화면에서 "새 견적 작성"으로 들어온 경우 - 이 브라우저에 남아있던 예전 임시저장본은 무시하고 항상 깨끗하게 새로 시작
    state.customerId = customerId;
    state.customerName = customerName ? decodeURIComponent(customerName) : null;
    if(state.customerName) state.meta.customer = state.customerName;
    if(projectName) state.meta.project = decodeURIComponent(projectName);
    document.querySelectorAll('[data-meta]').forEach(el=>{ el.value = state.meta[el.dataset.meta] || ''; });
    updateQuoteTypeSwitch();
    bathroomGroupIds();
    renderAll();
    await loadCustomerAddressCache();
  } else {
    // 독립적으로 열었을 때 (기존 동작 그대로)
    loadDraft();
    bathroomGroupIds();
    renderAll();
  }
})();

</script>
